/* ==================================================================
   هوية «لافندر · نيلي · أبيض · كريمي دافئ»
   ---------------------------------------------------------------
   طبقة فوق الأساس (التصميم الأزرق الغني) — تعطي التطبيق شخصيته
   الجديدة: لافندر هادئ + نيلي عميق + أبيض نقي + لمسة كريمية دافئة.
   Inspired by the two reference screens (splash + login) — original
   treatment, flat surfaces, no glass, no 3D, no perspective.
   آمنة: لا تغيّر أي وظيفة أو تنقّل — Coordinator seule للشكل واللون.
   ================================================================== */

/* ---------------------------------------------------------------
   1) الرموز اللونية الجديدة
   --------------------------------------------------------------- */
:root{
  /* الأساسي: نيلي عميق */
  --blue:#3F3197;        --blue-2:#2A2066;
  --blue-soft:#EFEBFA;   --blue-tint:#F7F5FD;  --blue-line:#DCD4F2;
  /* اللمسة الدافئة: كريمي */
  --yellow:#E0AE52;      --yellow-2:#B98B2C;
  --yellow-soft:#FBF4E4; --yellow-line:#EEDFC0;
  /* شخصيات الهوية */
  --lav:#A59DC3;         --lav-2:#8C83B6;      --lav-soft:#F1EEF8;  --lav-line:#E0D9F2;
  --cream:#F9F5EA;       --cream-2:#F3EDDC;    --cream-line:#E7DEC7;
  --indigo:#1A1440;      --indigo-2:#37257E;
  --grad-blue:linear-gradient(135deg,#8E85C4 0%,#4C3D9E 46%,#2C2168 100%);
  --grad-blue-soft:linear-gradient(135deg,rgba(142,133,196,.18),rgba(44,33,104,.08));
  --grad-lav:linear-gradient(135deg,#BDB5D8 0%,#8C83B6 100%);
  --grad-cream:linear-gradient(135deg,#FBF7EE 0%,#F1E9D8 100%);
  --grad-gold:linear-gradient(135deg,#F2D189 0%,#E0AE52 52%,#C8942F 100%);
  --bg:#F5F4FB; --bg-2:#FBFAFE;
  --card:#FFFFFF; --card-2:#FAF9FD;
  --sep:#EEECF6; --sep-2:#E4E0F0;
  --shadow-tile:0 6px 16px rgba(63,49,151,.26);
  --shadow-card:0 2px 6px rgba(30,22,80,.04), 0 12px 26px rgba(30,22,80,.06);
}

/* الوضع الداكن — نيلي عميق بلا زجاج */
html[data-theme="dark"]{
  --blue:#8E85C4;        --blue-2:#B6AEDA;
  --blue-soft:rgba(142,133,196,.18); --blue-tint:rgba(142,133,196,.09); --blue-line:rgba(165,157,195,.30);
  --yellow:#E8C273;      --yellow-2:#F0D49A;
  --yellow-soft:rgba(232,194,115,.14); --yellow-line:rgba(232,194,115,.28);
  --lav:#BDB5D8; --lav-2:#D3CDE8; --lav-soft:rgba(189,181,216,.14); --lav-line:rgba(189,181,216,.26);
  --cream:#2A2340;      --cream-2:#221C34;    --cream-line:rgba(249,245,234,.18);
  --indigo:#EDE9F8;      --indigo-2:#CFC7E8;
  --grad-blue:linear-gradient(135deg,#6E63A8 0%,#4B3E8C 48%,#2E2660 100%);
  --grad-lav:linear-gradient(135deg,#7B71AE 0%,#564A93 100%);
  --grad-cream:linear-gradient(135deg,#2E2748 0%,#241E3A 100%);
  --bg:#0D0A1C; --bg-2:#120E24;
  --sep:rgba(255,255,255,.08); --sep-2:rgba(255,255,255,.13);
}

/* ---------------------------------------------------------------
   2) لوحة الوقت: صباح / مساء
   --------------------------------------------------------------- */
:root, html[data-daypart="morning"]{
  --canvas:
    radial-gradient(120% 44% at 50% -8%, rgba(255,255,255,.82) 0%, rgba(255,255,255,0) 62%),
    radial-gradient(100% 36% at 50% 110%, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 58%),
    linear-gradient(180deg,#D5D0E3 0%,#CBC6DD 46%,#C3BDD5 100%);
  --canvas-ink:#040A1D;
  --canvas-ink-2:#37257E;
  --canvas-muted:#7C7699;
  --canvas-line:rgba(255,255,255,.72);
  --canvas-card:rgba(255,255,255,.96);
  --canvas-card-line:rgba(255,255,255,.85);
  --canvas-shadow:0 18px 44px rgba(52,40,112,.16);
}
html[data-daypart="evening"]{
  --canvas:
    radial-gradient(120% 44% at 50% -8%, rgba(126,112,206,.42) 0%, rgba(126,112,206,0) 62%),
    radial-gradient(100% 38% at 50% 110%, rgba(165,157,195,.24) 0%, rgba(165,157,195,0) 58%),
    linear-gradient(180deg,#241C55 0%,#1A1440 48%,#110D2C 100%);
  --canvas-ink:#FFFFFF;
  --canvas-ink-2:#CFC7E8;
  --canvas-muted:#9A92BE;
  --canvas-line:rgba(255,255,255,.16);
  --canvas-card:rgba(255,255,255,.07);
  --canvas-card-line:rgba(255,255,255,.14);
  --canvas-shadow:0 20px 50px rgba(0,0,0,.42);
}

/* ---------------------------------------------------------------
   3) شاشة البداية (السبلاش)
   --------------------------------------------------------------- */
.splash{
  position:fixed; inset:0; z-index:9999; display:grid; place-items:center;
  background:var(--canvas);
  animation:splashOut .55s 1.35s forwards;
  overflow:hidden;
}
.splash .sp-side{ position:absolute; top:0; bottom:0; width:13%; pointer-events:none }
.splash .sp-side-l{ inset-inline-start:0; background:linear-gradient(90deg,rgba(255,255,255,.42),rgba(255,255,255,0)) }
.splash .sp-side-r{ inset-inline-end:0; background:linear-gradient(270deg,rgba(255,255,255,.42),rgba(255,255,255,0)) }
html[data-daypart="evening"] .splash .sp-side-l{ background:linear-gradient(90deg,rgba(165,157,195,.16),rgba(165,157,195,0)) }
html[data-daypart="evening"] .splash .sp-side-r{ background:linear-gradient(270deg,rgba(165,157,195,.16),rgba(165,157,195,0)) }
.splash .sp-wrap{
  display:flex; flex-direction:column; align-items:center; gap:16px;
  text-align:center; padding:0 28px; position:relative; z-index:2;
}
.splash .sp-logo{
  width:132px; height:132px; border-radius:34px;
  background-image:var(--logo); background-size:contain; background-position:center; background-repeat:no-repeat;
  filter:drop-shadow(0 16px 30px rgba(46,36,105,.22));
  animation:spPop .75s cubic-bezier(.22,1,.3,1) both;
}
.splash .sp-name{
  color:var(--canvas-ink); font-size:25px; font-weight:900; letter-spacing:-.2px; line-height:1.45;
  animation:spFade .8s .18s both;
}
.splash .sp-sub{
  color:var(--canvas-ink-2); font-size:13.5px; font-weight:800; letter-spacing:.3px; margin-top:-8px;
  animation:spFade .8s .32s both;
}
.splash .sp-bar{
  width:78px; height:4px; border-radius:99px; background:rgba(55,37,126,.16); overflow:hidden;
  animation:spFade .8s .46s both;
}
.splash .sp-bar i{ display:block; width:40%; height:100%; border-radius:99px; background:var(--grad-blue); animation:spLoad 1.15s infinite ease-in-out }
html[data-daypart="evening"] .splash .sp-bar{ background:rgba(255,255,255,.16) }
.splash .sp-foot{
  position:absolute; inset-inline:0; bottom:calc(26px + var(--safe-b)); text-align:center;
  color:var(--canvas-muted); font-size:11px; font-weight:700; letter-spacing:.2px;
  animation:spFade .8s .7s both;
}
@keyframes spPop{ from{ transform:scale(.88); opacity:0 } to{ transform:none; opacity:1 } }
@keyframes spFade{ from{ transform:translateY(10px); opacity:0 } to{ transform:none; opacity:1 } }
@keyframes spLoad{ 0%{ transform:translateX(-120%) } 100%{ transform:translateX(260%) } }
@keyframes splashOut{ to{ opacity:0; visibility:hidden } }

/* ---------------------------------------------------------------
   4) شاشة اختيار الدور (قبل الدخول)
   --------------------------------------------------------------- */
#phone.entry-mode{ background:var(--canvas) }
html[data-daypart="morning"] #phone.entry-mode .statusbar{ color:#0B1226 }
html[data-daypart="morning"] #phone.entry-mode .statusbar svg{ color:#0B1226 }
html[data-daypart="evening"] #phone.entry-mode .statusbar{ color:#fff }
html[data-daypart="evening"] #phone.entry-mode .statusbar svg{ color:#fff }

.entry{
  position:relative;
  background:var(--canvas);
  background-image:var(--canvas);
  overflow-y:auto; justify-content:center;
  padding:calc(26px + var(--safe-t)) 20px calc(20px + var(--safe-b));
}
.entry::before, .entry::after{
  content:""; position:absolute; top:0; bottom:0; width:13%; pointer-events:none; z-index:0;
}
.entry::before{ inset-inline-start:0; background:linear-gradient(90deg,rgba(255,255,255,.40),rgba(255,255,255,0)) }
.entry::after{ inset-inline-end:0; background:linear-gradient(270deg,rgba(255,255,255,.40),rgba(255,255,255,0)) }
html[data-daypart="evening"] .entry::before{ background:linear-gradient(90deg,rgba(165,157,195,.15),rgba(165,157,195,0)) }
html[data-daypart="evening"] .entry::after{ background:linear-gradient(270deg,rgba(165,157,195,.15),rgba(165,157,195,0)) }
.entry > *{ position:relative; z-index:1 }

.entry-top{ text-align:center; margin-bottom:20px }
.entry .logo{
  width:104px; height:104px; margin:0 auto 14px; border-radius:30px; display:block;
  background-image:var(--logo); background-size:contain; background-position:center; background-repeat:no-repeat;
  filter:drop-shadow(0 14px 26px rgba(46,36,105,.22));
  animation:spPop .7s .1s cubic-bezier(.22,1,.3,1) both;
}
.entry h1{
  color:var(--canvas-ink); font-size:25px; font-weight:900; letter-spacing:-.3px; margin:0 0 4px;
  animation:spFade .6s .2s both;
}
.entry .lead{
  color:var(--canvas-ink-2); font-size:13.5px; font-weight:800; margin:0; letter-spacing:.2px;
  animation:spFade .6s .28s both;
}

.entry-card{
  background:var(--canvas-card); border:1px solid var(--canvas-card-line);
  border-radius:28px; padding:16px 14px 14px; box-shadow:var(--canvas-shadow);
  animation:spFade .6s .36s both;
  backdrop-filter:none; -webkit-backdrop-filter:none;
}
.entry-card-head{
  text-align:center; font-size:13px; font-weight:800; color:var(--canvas-ink);
  margin-bottom:12px;
}
.entry-card-head span{ display:block; font-size:11.5px; font-weight:700; color:var(--canvas-muted); margin-top:2px }
.entry .roles{ gap:10px; margin-bottom:0 }
.entry .role{
  background:#fff; border:1px solid #ECE9F7; border-radius:22px; padding:14px 8px 13px;
  box-shadow:0 8px 22px rgba(30,22,80,.06); backdrop-filter:none; -webkit-backdrop-filter:none;
  transition:transform .14s, box-shadow .2s, border-color .2s;
}
.entry .role:active{ transform:scale(.97); box-shadow:0 4px 12px rgba(30,22,80,.10) }
.entry .role .ri{
  width:48px; height:48px; border-radius:16px; margin:0 auto 8px; display:grid; place-items:center;
  background:var(--grad-blue); color:#fff; box-shadow:0 6px 16px rgba(63,49,151,.26);
}
.entry .role .ri svg{ width:23px; height:23px }
.entry .role b{ color:var(--indigo); font-size:14.5px; font-weight:800; display:block }
.entry .role span{ color:var(--canvas-muted); font-size:10.5px; font-weight:700; display:block; margin-top:2px }
.entry .role.on{ border-color:var(--lav); box-shadow:0 10px 26px rgba(63,49,151,.14) }

.entry-foot{
  margin-top:16px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:9px;
  animation:spFade .6s .44s both;
}
.entry-foot .ver{ color:var(--canvas-muted); font-size:11px; font-weight:700 }
.day-toggle{
  display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border-radius:99px;
  background:var(--canvas-card); border:1px solid var(--canvas-card-line); color:var(--canvas-ink);
  font-size:11.5px; font-weight:800; box-shadow:0 6px 18px rgba(52,40,112,.10);
  transition:transform .14s;
}
.day-toggle:active{ transform:scale(.96) }
.day-toggle svg{ width:16px; height:16px; stroke-width:1.9; color:var(--lav-2) }
.entry .btn.ghost{
  background:var(--canvas-card); color:var(--canvas-ink-2); border:1px solid var(--canvas-card-line);
  box-shadow:none;
}
.entry .btn.ghost::before{ display:none }
.entry .center.small.muted{ color:var(--canvas-muted) }

/* ---------------------------------------------------------------
   5) بطاقة تسجيل الدخول
   --------------------------------------------------------------- */
.sheet-bg.canvas{
  background:var(--canvas); background-image:var(--canvas);
  backdrop-filter:none; -webkit-backdrop-filter:none;
  align-items:center; justify-content:center; padding:22px 18px;
}
.sheet.login-sheet{
  border-radius:30px; width:100%; max-width:430px; margin:0 auto;
  padding:10px 20px calc(20px + var(--safe-b)); max-height:94%;
  background:#fff; border:1px solid #EAE6F6; border-top:1px solid #EAE6F6;
  box-shadow:0 26px 60px rgba(40,30,96,.20);
  transform:translateY(18px) scale(.985); opacity:0;
  transition:transform .34s cubic-bezier(.32,.72,0,1), opacity .28s ease;
}
.sheet-bg.show .sheet.login-sheet{ transform:none; opacity:1 }
.sheet.login-sheet .handle{ display:none }
.lg-head{ text-align:center; margin-bottom:14px }
.lg-head .lg-t{ font-size:20px; font-weight:900; color:#040A1D; letter-spacing:-.2px }
.lg-head .lg-s{ font-size:12.5px; font-weight:700; color:#7C7699; margin-top:3px; line-height:1.6 }
.lg-seg{
  display:flex; gap:4px; background:#F3F1F9; border:1px solid #E7E3F3; border-radius:16px;
  padding:4px; margin-bottom:16px;
}
.lg-seg .sg{
  flex:1; padding:9px 4px; border-radius:12px; font-size:12px; font-weight:800; color:#7C7699;
  transition:all .18s cubic-bezier(.3,.8,.4,1); white-space:nowrap;
}
.lg-seg .sg.on{ background:#fff; color:#2A2066; box-shadow:0 5px 14px rgba(30,22,80,.12) }
.lg-seg .sg:active{ transform:scale(.97) }
.lg-field{ margin-bottom:13px }
.lg-field > label{
  display:block; font-size:12.5px; font-weight:800; color:#37257E; margin-bottom:6px; text-align:start;
}
.lg-in{ position:relative }
.lg-in .input{
  width:100%; border-radius:15px; border:1px solid #E4E0F1; background:#FBFAFE; color:#0B1226;
  padding:14px 44px 14px 14px; font-size:15px; font-weight:600;
  transition:border-color .18s ease, box-shadow .18s ease, background .18s ease;
}
.lg-in .input:focus{
  outline:none; background:#fff; border-color:#8C83B6; box-shadow:0 0 0 4px rgba(140,131,182,.16);
}
.lg-in .input::placeholder{ color:#939FB3; font-weight:600 }
.lg-in .in-ic{
  position:absolute; inset-inline-end:13px; inset-block-start:50%; transform:translateY(-50%);
  color:#4C3D9E; pointer-events:none; display:grid; place-items:center;
}
.lg-in .in-ic svg{ width:19px; height:19px; stroke-width:1.8 }
.lg-in .eye{
  position:absolute; inset-inline-start:8px; inset-block-start:50%; transform:translateY(-50%);
  width:34px; height:34px; border-radius:11px; display:grid; place-items:center;
  color:#8C83B6; background:transparent;
}
.lg-in .eye:active{ background:#F3F1F9 }
.lg-in .eye svg{ width:18px; height:18px; stroke-width:1.8 }
.lg-remember{
  display:flex; align-items:center; gap:9px; margin:4px 0 16px; cursor:pointer;
  font-size:12.5px; font-weight:700; color:#4B4370;
}
.lg-remember input{
  width:19px; height:19px; accent-color:#4C3D9E; flex:0 0 auto; cursor:pointer;
}
.lg-go{
  width:100%; border-radius:17px; padding:15px 18px; font-size:15.5px; font-weight:800;
  background:var(--grad-blue); color:#fff; box-shadow:0 14px 30px rgba(63,49,151,.30);
  display:flex; align-items:center; justify-content:center; gap:9px;
}
.lg-go::before{ display:none }
.lg-go:active{ transform:scale(.98) }
.lg-go svg{ width:18px; height:18px }
.lg-foot{
  margin-top:14px; padding:12px 14px; border-radius:16px; background:var(--grad-cream);
  border:1px solid var(--cream-line); text-align:center;
}
.lg-foot b{ display:flex; align-items:center; justify-content:center; gap:6px; font-size:12px; font-weight:800; color:#6B5424 }
.lg-foot b svg{ width:15px; height:15px; flex:none; stroke-width:1.9 }
.lg-foot span{ display:block; font-size:11px; font-weight:700; color:#8A7442; margin-top:2px; line-height:1.6 }

/* ---------------------------------------------------------------
   6) شخصية التطبيق داخله (لون وأيقونات)
   --------------------------------------------------------------- */
.screen{ background:linear-gradient(180deg,#F8F7FD 0%,#F1EFF9 48%,#EDEAF6 100%) }
body{ background:#E8E5F3 }
@media (min-width:520px){
  body{ background:radial-gradient(1100px 620px at 74% -8%, #FFFFFF 0%, #EFECF8 48%, #E6E2F2 100%) }
}
.hero{
  background:
    radial-gradient(260px 180px at 12% -26%, rgba(255,255,255,.26), rgba(255,255,255,0) 70%),
    radial-gradient(200px 160px at 98% 116%, rgba(255,255,255,.14), rgba(255,255,255,0) 72%),
    linear-gradient(152deg,#6B5DBA 0%,#453593 46%,#2C2168 100%);
  box-shadow:0 18px 38px rgba(44,33,104,.26);
}
.hero .h-grid div.y{ color:var(--blue-2) }
.hero .h-grid div.y b{ color:var(--blue-2) }
.tile{ border-color:#EAE7F6 }
.tile .ti{ box-shadow:var(--shadow-tile) }
.tile.n .ti{ background:linear-gradient(135deg,#BDB5D8 0%,#8C83B6 50%,#6B5DBA 100%); box-shadow:0 6px 16px rgba(140,131,182,.28) }
.tile.y .ti{ background:var(--grad-gold); box-shadow:0 6px 16px rgba(224,174,82,.30) }
.card, .hw, .g-card, .driver, .list{ border-color:#EAE7F6 }
.btn{ box-shadow:0 10px 22px rgba(63,49,151,.26) }
.btn:active{ box-shadow:0 5px 12px rgba(63,49,151,.24) }
.btn.ghost{ border-color:#E6E2F4; color:var(--blue); box-shadow:0 6px 16px rgba(30,22,80,.06) }
.btn.soft{ background:var(--blue-soft); color:var(--blue) }
.btn.yellow{ background:var(--grad-gold); color:#4A3600; box-shadow:0 10px 22px rgba(200,148,47,.28) }
.input{ background:#FBFAFE; border-color:#E7E3F2 }
.input:focus{ border-color:var(--blue); box-shadow:0 0 0 4px rgba(140,131,182,.16) }
.chip{ border-color:#E7E3F2 }
.chip.on{ background:var(--grad-blue); border-color:transparent; box-shadow:0 6px 14px rgba(63,49,151,.26) }
.chip.on, .chip.on *{ color:#fff }
.pill.blue{ background:var(--blue-soft); color:var(--blue-2); border-color:var(--blue-line) }
.pill.yellow{ background:var(--yellow-soft); color:#7A5A15; border-color:var(--yellow-line) }
.note.blue{ background:var(--blue-tint); color:var(--blue-2); border-color:var(--blue-line) }
.note.yellow{ background:var(--yellow-soft); color:#7A5A15; border-color:var(--yellow-line) }
.seg3{ background:#F3F1F9; border-color:#E7E3F2 }
.seg3 .seg-btn.on{ background:var(--grad-blue); box-shadow:0 6px 14px rgba(63,49,151,.26) }
.seg3 .seg-btn.on, .seg3 .seg-btn.on *{ color:#fff }
.tabbar{ border-top-color:#EAE7F6; box-shadow:0 -8px 26px rgba(30,22,80,.08) }
.tabbar .tab.on{ box-shadow:0 6px 14px rgba(63,49,151,.28) }
.bubble.out{ box-shadow:0 8px 20px rgba(63,49,151,.24) }
.bubble.in{ border-color:#EAE7F6 }
.chat-input{ border-top-color:#EAE7F6 }
.chat-input textarea{ background:#FBFAFE; border-color:#E7E3F2 }
.chat-input textarea:focus{ border-color:var(--blue) }
.send-btn{ background:var(--grad-blue); box-shadow:0 6px 14px rgba(63,49,151,.26) }
.bar{ background:#EAE7F6 }
.bar i{ background:var(--grad-blue) }
.empty{ border-color:#DFDAF0 }
.empty svg{ color:var(--blue) }
.toast{ background:#16113A; box-shadow:0 12px 34px rgba(16,12,50,.34) }
.row .ri{ background:var(--blue-soft); color:var(--blue) }
.row .ri.y{ background:var(--yellow-soft); color:var(--yellow-2) }
.card-head h3 svg{ background:var(--blue-soft); color:var(--blue) }
.icon-btn{ border-color:#EAE7F6 }
.theme-card{ border-color:#EAE7F6 }

/* الوضع الداكن — نفس الشخصية */
html[data-theme="dark"] body{ background:#080616 }
html[data-theme="dark"] #phone{
  background:
    radial-gradient(80% 42% at 84% -8%, rgba(78,62,163,.34) 0%, rgba(8,6,22,0) 62%),
    radial-gradient(70% 38% at 6% 2%, rgba(142,133,196,.18) 0%, rgba(8,6,22,0) 60%),
    linear-gradient(180deg,#171230 0%, #100C24 60%, #0A0718 100%);
}
html[data-theme="dark"] .screen{ background:linear-gradient(180deg,#16112C 0%, #100C22 52%, #0C0919 100%) }
html[data-theme="dark"] .hero{
  background:
    radial-gradient(260px 180px at 12% -26%, rgba(255,255,255,.12), rgba(255,255,255,0) 70%),
    linear-gradient(152deg,#584CA0 0%,#3B3078 48%,#261E52 100%);
  box-shadow:0 18px 40px rgba(0,0,0,.5);
}
html[data-theme="dark"] .tile.n .ti{ background:linear-gradient(135deg,#7B71AE 0%,#5A4E93 50%,#453A80 100%) }
html[data-theme="dark"] .tile.y .ti{ background:var(--grad-gold) }
html[data-theme="dark"] .btn{ box-shadow:0 10px 22px rgba(0,0,0,.5) }
html[data-theme="dark"] .input{ background:#171233; border-color:var(--sep-2) }
html[data-theme="dark"] .input:focus{ background:#1C1640; box-shadow:0 0 0 4px rgba(142,133,196,.18) }
html[data-theme="dark"] .chat-input{ background:#100C24; border-top-color:var(--sep-2) }
html[data-theme="dark"] .chat-input textarea{ background:#191436; border-color:var(--sep-2) }
html[data-theme="dark"] .chat-input textarea:focus{ background:#1F1942 }
html[data-theme="dark"] .tabbar .tab.on{ box-shadow:0 6px 16px rgba(0,0,0,.55) }
html[data-theme="dark"] .bubble.out{ box-shadow:0 8px 20px rgba(0,0,0,.5) }
html[data-theme="dark"] .seg3{ background:#171233; border-color:var(--sep-2) }
html[data-theme="dark"] .toast{ background:rgba(32,26,62,.96) }

/* ---------------------------------------------------------------
   7) مرفقات الدردشة (صور وملفات)
   --------------------------------------------------------------- */
.att-row{ display:flex; flex-wrap:wrap; gap:8px; margin-top:8px }
.att-thumb{
  width:104px; height:104px; border-radius:16px; overflow:hidden; position:relative;
  border:1px solid rgba(255,255,255,.35); box-shadow:0 6px 16px rgba(16,12,50,.16);
  background:#F3F1F9; display:block; padding:0;
}
.att-thumb img{ width:100%; height:100%; object-fit:cover; display:block }
.att-thumb .att-x{
  position:absolute; top:4px; inset-inline-end:4px; width:22px; height:22px; border-radius:50%;
  background:rgba(16,12,50,.72); color:#fff; display:grid; place-items:center;
}
.att-thumb .att-x svg{ width:12px; height:12px; stroke-width:2.4 }
.att-file{
  display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:15px;
  background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.26);
  max-width:100%; text-align:start; color:inherit;
}
.bubble.in .att-file{ background:#F6F4FC; border-color:#E7E3F2 }
.att-file .af-ic{
  width:34px; height:34px; border-radius:11px; display:grid; place-items:center; flex:0 0 auto;
  background:rgba(255,255,255,.24); color:#fff;
}
.bubble.in .att-file .af-ic{ background:var(--lav-soft); color:var(--blue-2) }
.att-file .af-ic svg{ width:17px; height:17px; stroke-width:1.9 }
.att-file .af-tx{ min-width:0; flex:1 }
.att-file .af-tx b{ display:block; font-size:12px; font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.att-file .af-tx span{ display:block; font-size:10.5px; font-weight:700; opacity:.72 }
.bubble.out .att-file .af-tx b, .bubble.out .att-file .af-tx span{ color:#fff }
.bubble.in .att-file .af-tx b{ color:var(--label) }
.bubble.in .att-file .af-tx span{ color:var(--secondary) }

.att-pending{ display:flex; flex-wrap:wrap; gap:8px; padding:8px 10px; border-radius:15px; background:#F6F4FC; border:1px dashed #DCD4F2 }
.att-pending .att-file{ background:#fff; border-color:#E7E3F2 }
.att-file .ab-x{ width:26px; height:26px; border-radius:9px; display:grid; place-items:center; flex:none;
  background:var(--red-soft); color:#C22B26 }
.att-file .ab-x svg{ width:13px; height:13px; stroke-width:2.2 }
.chat-input .att-pending{ flex:0 0 100%; order:-1; margin:0 0 8px }
.chat-input{ flex-wrap:wrap }
.attach-btn{
  width:40px; height:40px; border-radius:50%; flex:none; display:grid; place-items:center;
  background:var(--blue-soft); color:var(--blue); border:1px solid var(--blue-line);
  transition:transform .14s ease;
}
.attach-btn:active{ transform:scale(.93) }
.attach-btn svg{ width:18px; height:18px; stroke-width:1.9 }
html[data-theme="dark"] .attach-btn{ background:rgba(142,133,196,.20); color:#CFC7E8; border-color:var(--blue-line) }

/* عارض الصور بملء الشاشة */
.img-viewer{
  position:absolute; inset:0; z-index:400; background:rgba(10,8,28,.95);
  display:grid; place-items:center; padding:18px;
}
.img-viewer img{ max-width:100%; max-height:100%; border-radius:16px; object-fit:contain; display:block }
.img-viewer .iv-x{
  position:absolute; top:calc(14px + var(--safe-t)); inset-inline-end:14px;
  width:42px; height:42px; border-radius:50%; background:rgba(255,255,255,.16); color:#fff;
  display:grid; place-items:center; border:1px solid rgba(255,255,255,.24);
}
.img-viewer .iv-x svg{ width:20px; height:20px }

/* ---------------------------------------------------------------
   8) تنبيه حجب الدرجات
   --------------------------------------------------------------- */
.blocked-note{
  display:flex; gap:13px; align-items:flex-start; padding:16px; border-radius:22px;
  background:var(--grad-cream); border:1px solid var(--cream-line); box-shadow:var(--shadow-card);
}
.blocked-note .bn-ic{
  width:46px; height:46px; border-radius:15px; flex:0 0 auto; display:grid; place-items:center;
  background:#fff; color:#B98B2C; border:1px solid var(--cream-line);
}
.blocked-note .bn-ic svg{ width:23px; height:23px; stroke-width:1.8 }
.blocked-note h4{ margin:0 0 4px; font-size:14.5px; font-weight:800; color:#4A3600 }
.blocked-note p{ margin:0; font-size:12.5px; font-weight:700; color:#7A5F2A; line-height:1.75 }
.blocked-note .bn-reason{
  margin-top:8px; padding-top:8px; border-top:1px dashed var(--cream-line);
  font-size:11.5px; font-weight:700; color:#8A7442;
}
html[data-theme="dark"] .blocked-note{ background:var(--grad-cream) }
html[data-theme="dark"] .blocked-note h4{ color:#F0DCA8 }
html[data-theme="dark"] .blocked-note p{ color:#D9C79A }
html[data-theme="dark"] .blocked-note .bn-reason{ color:#C7B489; border-top-color:rgba(249,245,234,.16) }

/* ---------------------------------------------------------------
   9) الخط العربي الناعم (Cairo) — متناسق مع خلفية الدخول
   --------------------------------------------------------------- */
body{
  font-family:'Cairo','Noto Sans Arabic',-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',system-ui,Tahoma,sans-serif;
  letter-spacing:0;
}

/* ---------------------------------------------------------------
   10) شارات الإشعارات في الوضع الداكن — كلها بلون شارة الجرس
   --------------------------------------------------------------- */
html[data-theme="dark"] .badge-dot{ background:#FFC53D; color:#231A00; border-color:#0D0A1C; box-shadow:0 6px 16px rgba(255,197,61,.42) }
html[data-theme="dark"] .tab-badge{ background:#FFC53D; color:#231A00; border-color:#0D0A1C; box-shadow:0 6px 16px rgba(255,197,61,.36) }
html[data-theme="dark"] .udot{ background:#FFC53D; box-shadow:0 0 0 3px rgba(255,197,61,.20) }
/* الشارة تبقى فوق الأيقونة ولا تنزل إلى أسفل الشريط */
html[data-theme="dark"] .tabbar button .tab-badge{
  position:absolute; top:1px; inset-inline-start:calc(50% - 19px);
  margin:0; z-index:3;
}

const ATTACH_MAX = { image: 2 * 1024 * 1024, file: 5 * 1024 * 1024 };  /* صور ٢ م.ب · ملفات ٥ م.ب */
const fmtSize = (b) => {
  const n = Number(b) || 0;
  if (n < 1024) return n + ' بايت';
  if (n < 1048576) return Math.round(n / 1024) + ' ك.ب';
  return (n / 1048576).toFixed(1) + ' م.ب';
};
const readFileAsDataURL = (file) => new Promise((res, rej) => {
  try {
    const r = new FileReader();
    r.onload = () => res(String(r.result || ''));
    r.onerror = () => rej(new Error('تعذّرت قراءة الملف'));
    r.readAsDataURL(file);
  } catch (e) { rej(e); }
});
const isImageFile = (f) => !!(f && ((f.type && String(f.type).indexOf('image/') === 0) || /\.(png|jpe?g|gif|webp|bmp|heic|heif)$/i.test(f.name || '')));
/* ضغط الصورة قبل الإرسال حتى لا تتضخم التخزين والمزامنة */
const compressImage = async (file, maxDim = 900, quality = 0.72) => {
  const dataUrl = await readFileAsDataURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('صورة غير صالحة')); i.src = dataUrl; });
    const scale = Math.min(1, maxDim / Math.max(img.width || 1, img.height || 1));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round((img.width || 1) * scale));
    c.height = Math.max(1, Math.round((img.height || 1) * scale));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const out = c.toDataURL('image/jpeg', quality);
    return { name: file.name || 'صورة', size: Math.round(out.length * 0.75), dataUrl: out };
  } catch (e) { return { name: file.name || 'صورة', size: file.size || 0, dataUrl }; }
};
/* يحوّل ملفاً مختاراً إلى مرفق جاهز للإرسال (صورة مضغوطة أو ملف base64) */
const prepAttachment = async (file) => {
  const name = file.name || 'ملف';
  if (isImageFile(file)) {
    const c = await compressImage(file);
    if (c.size > ATTACH_MAX.image) throw new Error('حجم الصورة يتجاوز ' + fmtSize(ATTACH_MAX.image));
    return { type: 'image', name, size: c.size, mime: 'image/jpeg', url: c.dataUrl };
  }
  if ((file.size || 0) > ATTACH_MAX.file) throw new Error('حجم الملف يتجاوز ' + fmtSize(ATTACH_MAX.file));
  const url = await readFileAsDataURL(file);
  return { type: 'file', name, size: file.size || 0, mime: file.type || '', url };
};
const attIcon = (a) => (a && a.type === 'image') ? 'image' : 'file';
/* مرفق → blob لفتحه أو تنزيله */
const attBlob = (a) => {
  try {
    const s = String((a && a.url) || '');
    const i = s.indexOf(',');
    if (i < 0) return null;
    const head = s.slice(0, i), b64 = s.slice(i + 1);
    const mime = (head.match(/data:([^;]+)/) || [])[1] || (a && a.mime) || 'application/octet-stream';
    const bin = atob(b64); const arr = new Uint8Array(bin.length);
    for (let i2 = 0; i2 < bin.length; i2++) arr[i2] = bin.charCodeAt(i2);
    return new Blob([arr], { type: mime });
  } catch (e) { return null; }
};
/* عارض الصور بملء الشاشة */
const showImageViewer = (url, name) => {
  const host = document.getElementById('phone') || document.body;
  const ov = document.createElement('div');
  ov.className = 'img-viewer';
  ov.innerHTML = `<img src="${esc(url)}" alt="${esc(name || '')}"><button class="iv-x" type="button" aria-label="إغلاق">${ic('x')}</button>`;
  host.appendChild(ov);
  const close = () => { try { ov.remove(); } catch (e) {} };
  const bx = ov.querySelector('.iv-x'); if (bx) bx.onclick = close;
  ov.onclick = (e) => { if (e.target === ov) close(); };
};
/* فتح/تنزيل مرفق */
const openAttachment = (a) => {
  if (!a || !a.url) return;
  if (a.type === 'image') { showImageViewer(a.url, a.name); return; }
  const blob = attBlob(a);
  if (!blob) { if (typeof Toast === 'function') Toast('تعذّر فتح المرفق', 'err'); return; }
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url; link.download = a.name || 'ملف';
  document.body.appendChild(link); link.click(); link.remove();
  setTimeout(() => { try { URL.revokeObjectURL(url); } catch (e) {} }, 30000);
};

const attHtml = (atts, mid) => {

/* استخراج مرفق من رسالة حسب المعرّف والفهرس */
const attByIndex = (mid, ai) => {

const readAttachments = async (fileList) => {
  const ok = [], errs = [];
  for (const f of [...(fileList || [])]) {
    try { ok.push(await prepAttachment(f)); }
    catch (e) { errs.push(e.message || 'تعذّر إرفاق الملف'); }
  }
  return { ok, errs };
};
/* شريط المرفقات المعلّقة (فوق صندوق الكتابة) */
const createAttachBox = () => {
  const box = { list: [], el: null };
  const paint = () => {
    if (!box.el) return;
    if (!box.list.length) { box.el.innerHTML = ''; box.el.style.display = 'none'; return; }
    box.el.style.display = '';
    box.el.innerHTML = box.list.map((a, i) => `<div class="att-file">
        <span class="af-ic">${ic(attIcon(a))}</span>
        <span class="af-tx"><b>${esc(a.name || 'ملف')}</b><span>${fmtSize(a.size)}</span></span>
        <button class="ab-x" type="button" data-rm="${i}" aria-label="حذف المرفق">${ic('x')}</button>
      </div>`).join('');
    $$('[data-rm]', box.el).forEach(b => b.onclick = () => { box.list.splice(+b.dataset.rm, 1); paint(); });
  };

  /* السائقون */

    { n: 'أمير الطائي', car: 'نيسان صني — فضية', ph: '0774 555 6677', areas: ['الزهراء','الرشيدية','الطحين'], seats: 9 },
    { n: 'محمد الحيالي', car: 'شيفروليه — بيضاء', ph: '0775 666 7788', areas: ['المأمون','الصناعة','الوحدة'], seats: 13 }
  ];
  d.drivers = DRIVERS.map((x, i) => ({

  }));

  d.requests = [

  ];

  /* الدردشة: محادثة الإدارة مع الطالب الأول + محادثة مدرس */
  const now = Date.now();

  d.messages = [

    { thread_id: 'th_t_st0_t0', from: 'staff', text: 'أهلاً أحمد، أحسنت في حفظ الآيات اليوم.', at: new Date(now - 7200e3).toISOString() },

  d.notifications = [

    { id: uid('n'), to: 'driver', type: 'request', title: 'طلب إضافة جديد', body: 'وصلك طلب اشتراك جديد من طالب في منطقتك.', at: new Date(now - 3600e3).toISOString(), read: false },

    hours: '7:30 ص — 2:00 م', note: 'التسجيل للعام القادم مفتوح — يوجد خصم للإخوة.'

const Store = {
  load() {
    try { const raw = localStorage.getItem(KEY); if (raw) { Object.assign(DB, JSON.parse(raw)); DB.ready = true; return; } } catch {}
    Object.assign(DB, seed()); DB.ready = true; this.save();
  },
  save() { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch {} },
  reset() { try { localStorage.removeItem(KEY); localStorage.removeItem('alawael.app.v1'); } catch {} location.reload(); }
};

/* ==========================================================================
   4) مساعدات البيانات
   ========================================================================== */
const Q = {
  school: id => DB.schools.find(s => s.id === id),
  grade: id => DB.grades.find(g => g.id === id),
  section: id => DB.sections.find(s => s.id === id),
  subject: id => DB.subjects.find(s => s.id === id),
  teacher: id => DB.teachers.find(t => t.id === id),
  student: id => DB.students.find(s => s.id === id),
  driver: id => DB.drivers.find(d => d.id === id),
  guardians: () => { if (!DB.guardians) DB.guardians = DB.guardian ? [DB.guardian] : []; return DB.guardians; },
  label: {
    school: id => Q.school(id)?.name || '—',
    grade: id => Q.grade(id)?.name || '—',
    section: id => Q.section(id)?.name || '—'
  },
  gradesOf: schoolId => DB.grades.filter(g => g.school_id === schoolId).sort((a, b) => a.order - b.order),
  sectionsOf: gradeId => DB.sections.filter(s => s.grade_id === gradeId).sort((a, b) => a.order - b.order),
  studentsOf: sectionId => DB.students.filter(s => s.section_id === sectionId).sort((a, b) => a.order - b.order),
  studentsOfGrade: gradeId => DB.students.filter(s => s.grade_id === gradeId),
  teachersOf: schoolId => DB.teachers.filter(t => t.school_id === schoolId),
  subjectsOf: () => DB.subjects,

  avg(studentId, period) {
    const rows = DB.monthlyGrades.filter(g => g.student_id === studentId && (!period || g.period === period));
    if (!rows.length) return null;
    return Math.round(rows.reduce((s, r) => s + (+r.value || 0), 0) / rows.length);
  },
  gradeLetter(v) { return v == null ? '—' : v >= 90 ? 'ممتاز' : v >= 80 ? 'جيد جداً' : v >= 70 ? 'جيد' : v >= 60 ? 'متوسط' : 'يحتاج متابعة'; },

  /* ---------- حجب الدرجات (قرار الإدارة) ---------- */
  /* سجل الحجب: [{ id, student_id, student_name, school_id, reason, blocked_at, is_deleted }] */
  blockedStudents: () => (DB.blockedStudents || []).filter(b => b && !b.is_deleted),
  isGradeBlocked: (studentId) => !!(DB.blockedStudents || []).some(b => b && !b.is_deleted && b.student_id === studentId),
  gradeBlockOf: (studentId) => (DB.blockedStudents || []).find(b => b && !b.is_deleted && b.student_id === studentId) || null,

  hwFor: (student, date) => DB.homeworks.filter(h =>
    (!date || h.date === date) && (h.section_ids || []).includes(student.section_id)
  ).sort((a, b) => b.date.localeCompare(a.date)),
  hwOfTeacher: (teacherId) => DB.homeworks.filter(h => h.teacher_id === teacherId).sort((a, b) => b.date.localeCompare(a.date)),

  dailyExamsFor: (student) => DB.dailyExams.filter(e => {
    const secs = e.section_ids && e.section_ids.length ? e.section_ids : (e.section_id ? [e.section_id] : []);
    if (!secs.includes(student.section_id)) return false;
    if (e.grade_id && e.grade_id !== student.grade_id) return false;
    if (e.school_id && e.school_id !== student.school_id) return false;
    return true;
  }),
  examGrade: (examId, studentId) => DB.dailyGrades.find(g => g.exam_id === examId && g.student_id === studentId)?.value ?? null,
  monthGrade: (studentId, subjectId, period) => DB.monthlyGrades.find(g => g.student_id === studentId && g.subject_id === subjectId && g.period === period)?.value ?? null,
  /* الغيابات: سجلات الطالب مرتبة من الأحدث */
  absencesOf: (sid) => (DB.absences || []).filter(a => a.student_id === sid)
    .slice().sort((a, b) => String(b.date || '').localeCompare(String(a.date || ''))),
  absenceCount: (sid) => (DB.absences || []).filter(a => a.student_id === sid && a.type !== 'excused').length,

  /* الجدول الأسبوعي — يقبل شكل اللوحة { "0-0": subjectId } أو شكل التطبيق (مصفوفة أيام) */
  weeklyFor(sectionId) {
    const DAYS = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس'];
    const store = DB.weekly || {};
    const stored = store[sectionId];
    const sec = Q.section(sectionId);
    const team = DB.teachers.filter(t => t.section_ids && t.section_ids.includes(sectionId));
    const teacherOf = (sid) => (team.find(t => t.subject_id === sid) ||
      DB.teachers.find(t => t.subject_id === sid && t.school_id === (sec && sec.school_id))) || null;
    const periodAt = (i) => (typeof PERIODS !== 'undefined' && PERIODS[i]) ? PERIODS[i] : { id: i + 1, label: `الحصة ${i + 1}` };
    const timeOf = (i) => { const p = periodAt(i); return p.time || p.start || `${8 + i}:30`; };
    /* عدد الحصص: من بيانات اللوحة إن وُجدت، وإلا 7
       اللوحة تستخدم مفاتيح "يوم-حصة" بيوم 1..5 وحصة 1..7، لذلك الحصة القصوى = الرقم الثاني نفسه */
    let periodCount = 7;
    if (stored && typeof stored === 'object') {
      const cells = stored.cells && typeof stored.cells === 'object' ? stored.cells : (Array.isArray(stored) ? {} : stored);
      const keys = Object.keys(cells || {});
      if (keys.length) {
        const mx = keys.reduce((m, k) => { const p = +String(k).split('-')[1]; return Number.isFinite(p) ? Math.max(m, p) : m; }, 0);
        periodCount = Math.min(12, Math.max(1, mx));
      }
    }
    const build = (getSubject) => DAYS.map((dn, di) => ({
      day: di, name: dn,
      periods: Array.from({ length: periodCount }, (_, pi) => {
        const sid = getSubject(di, pi);
        const t = sid ? teacherOf(sid) : null;
        return { no: pi + 1, subject_id: sid || null, teacher_id: t ? t.id : null, time: timeOf(pi) };
      })
    }));
    /* اللوحة تستخدم مفاتيح "يوم-حصة" بيوم 1..5 (الأحد..الخميس) وحصة 1..7 —
       التطبيق يستخدم فهرساً 0-based، لذلك نحوّل هنا حتى لا يختفي يوم الأحد */
    const fromDashCells = (cells) => build((di, pi) => cells[`${di + 1}-${pi + 1}`] || cells[`${di}-${pi}`] || null);

    /* (أ) شكل التطبيق: مصفوفة أيام */
    if (Array.isArray(stored) && stored.length) return stored;
    /* (ب) شكل اللوحة: خريطة خلايا "يوم-حصة" */
    if (stored && typeof stored === 'object') {
      const cells = stored.cells && typeof stored.cells === 'object' ? stored.cells : stored;
      const keys = Object.keys(cells);
      if (keys.length) return fromDashCells(cells);
    }
    /* (ج) لا يوجد جدول محفوظ: وضع تجريبي فقط يولّد جدولاً وهمياً */
    const cloudOn = (typeof CloudApp !== 'undefined' && CloudApp.enabled);
    if (!cloudOn && DB.subjects && DB.subjects.length) {
      const rnd = mkRng(hash(sectionId));
      return build(() => DB.subjects[Math.floor(rnd() * DB.subjects.length)].id);
    }
    return build(() => null);
  },

  monthExamsOf: (schoolId, period) => DB.monthlyExams
    .filter(e => (!schoolId || e.school_id === schoolId) && (!period || e.period === period))
    .sort((a, b) => a.date.localeCompare(b.date)),

  /* ------- الدردشة ------- */
  threadAdmin(studentId) {
    let th = DB.threads.find(t => t.kind === 'admin' && t.student_id === studentId);
    if (!th) { th = { id: 'th_a_' + studentId, kind: 'admin', student_id: studentId, last_at: new Date().toISOString(), unread: 0 }; DB.threads.push(th); Store.save(); }
    return th;
  },
  threadTeacher(teacherId, studentId) {
    let th = DB.threads.find(t => t.kind === 'teacher' && t.teacher_id === teacherId && t.student_id === studentId);
    if (!th) { th = { id: `th_t_${studentId}_${teacherId}`, kind: 'teacher', student_id: studentId, teacher_id: teacherId, last_at: new Date().toISOString(), unread: 0 }; DB.threads.push(th); Store.save(); }
    return th;
  },
  adminThreads: () => DB.threads.filter(t => t.kind === 'admin' && Q.msgs(t.id).length)
    .sort((a, b) => (b.last_at || '').localeCompare(a.last_at || '')),
  teacherThreads: (teacherId) => DB.threads.filter(t => t.kind === 'teacher' && t.teacher_id === teacherId && Q.msgs(t.id).length)
    .sort((a, b) => (b.last_at || '').localeCompare(a.last_at || '')),
  msgs: (threadId) => DB.messages.filter(m => m.thread_id === threadId).sort((a, b) => a.at.localeCompare(b.at)),
  sendMsg(threadId, from, text, opts = {}) {
    const th = DB.threads.find(t => t.id === threadId);
    const at = new Date().toISOString();
    const rec = { id: uid('m'), thread_id: threadId, from, text, at, ...(opts.auto ? { auto: true } : {}) };
    /* المرفقات تُحفظ مع الرسالة حتى تظهر للطرفين وتنتقل عبر المزامنة */
    if (opts.attachments && opts.attachments.length) rec.attachments = opts.attachments;
    DB.messages.push(rec);
    if (th) { th.last_at = at; th.unread = opts.unread != null ? opts.unread : (th.unread || 0); }
    Store.save();
  },
  /* تعديل رسالة (الإدارة) — يُرفع تلقائياً إلى اللوحة عبر الحفظ */
  editMsg(id, text) {
    const m = DB.messages.find(x => x.id === id); if (!m) return false;
    m.text = String(text || '').trim(); m.edited = true; m.edited_at = new Date().toISOString();
    Store.save(); return true;
  },
  /* حذف رسالة (الإدارة) — يُسجَّل كحذف نهائي حتى لا تعود من السحابة */
  deleteMsg(id) {
    const i = DB.messages.findIndex(x => x.id === id); if (i < 0) return false;
    DB.messages.splice(i, 1);
    if (!DB._deleted) DB._deleted = {};
    if (!DB._deleted.messages) DB._deleted.messages = [];
    if (!DB._deleted.messages.includes(id)) DB._deleted.messages.push(id);
    Store.save(); return true;
  },
  /* تسجيل حذف عام (رسالة/واجب/طلب اشتراك) حتى يصل الحذف إلى اللوحة ولا يُبعث العنصر */
  tombstone(kind, id) {
    if (!DB._deleted) DB._deleted = {};
    if (!DB._deleted[kind]) DB._deleted[kind] = [];
    if (!DB._deleted[kind].includes(id)) DB._deleted[kind].push(id);
  },
  /* آخر وقت فُتحت فيه المحادثة على هذا الجهاز — لحساب غير المقروء بدقة لكل حساب */
  threadSeen: (threadId) => {
    try { return (JSON.parse(localStorage.getItem('alawael.threadSeen') || '{}') || {})[threadId] || 0; } catch (e) { return 0; }
  },
  markRead(threadId) {
    const th = DB.threads.find(t => t.id === threadId);
    if (th) { th.unread = 0; }
    try {
      const m = JSON.parse(localStorage.getItem('alawael.threadSeen') || '{}') || {};
      m[threadId] = Date.now();
      localStorage.setItem('alawael.threadSeen', JSON.stringify(m));
    } catch (e) {}
    Store.save();
  },
  /* هل الرسالة واردة إلى الحساب الحالي؟ (الطالب: كل ما ليس منه · الإدارة/المدرس: رسائل الطالب) */
  isIncoming: (m) => {
    const role = (typeof App !== 'undefined') ? App.role : null;
    if (role === 'student' || role === 'guardian') return m.from !== 'me';
    return m.from === 'me';
  },
  /* عدد الرسائل الواردة غير المقروءة في محادثة واحدة */
  threadUnread: (threadId) => {
    const seen = Q.threadSeen(threadId);
    return Q.msgs(threadId).filter(m => Q.isIncoming(m) && new Date(m.at).getTime() > seen).length;
  },
  unreadThreads: (list) => list.filter(t => Q.threadUnread(t.id) > 0).length,
  /* عدد الرسائل غير المقروءة الواردة لهذا الحساب (للشارات الحمراء) */
  unreadMsgs: () => {
    const key = (typeof App !== 'undefined' && App.notifOwner) ? App.notifOwner() : null;
    if (!key) return 0;
    const me = (typeof DB !== 'undefined' && DB.viewer) || null;
    return (DB.threads || []).filter(t => {
      if (key === 'admin') return t.kind === 'admin';
      if (key === 'teacher') return t.kind === 'teacher' && t.teacher_id === me;
      if (key === 'student') return me ? (t.student_id === me) : false;
      return false;
    }).reduce((n, t) => n + Q.threadUnread(t.id), 0);
  },

  notifFilter: (n, to) => {
    if (n.to !== to) return false;
    if (n.owner && DB.viewer && n.owner !== DB.viewer) return false;
    /* ما فُتح سابقاً على هذا الجهاز يبقى مقروءاً */
    if (!n.read) {
      try {
        const seen = JSON.parse(localStorage.getItem('alawael.readNotifs') || '[]');
        if (seen.includes(n.id)) { n.read = true; return true; }
      } catch (e) {}
    }
    return true;
  },
  notifs: (to) => DB.notifications.filter(n => Q.notifFilter(n, to)).sort((a, b) => b.at.localeCompare(a.at)),
  unread: (to) => DB.notifications.filter(n => Q.notifFilter(n, to) && !n.read).length,
  /* عدد إشعارات نوع معيّن غير المقروءة (الواجبات مثلاً) — حتى لا تظهر شارة الواجبات عند إشعار عام */
  unreadOfType: (to, type) => DB.notifications.filter(n => Q.notifFilter(n, to) && !n.read && n.type === type).length,
  /* عدد محادثات الطلبة التي لم يُرد عليها بعد (آخر رسالة من الطالب) */
  unansweredThreads: () => (DB.threads || []).filter(t => {
    if (t.kind !== 'admin') return false;
    const msgs = Q.msgs(t.id);
    return msgs.length && msgs[msgs.length - 1].from === 'me';
  }).length,
  push(to, type, title, body, extra = {}) {
    /* _local: إشعار أنشأه هذا التطبيق — يُرفع إلى اللوحة ليظهر في جرسها */
    DB.notifications.unshift({ id: uid('n'), to, type, title, body, at: new Date().toISOString(), read: false, _local: true, ...extra });
    Store.save();
    setTimeout(() => { if (window.App && App.role) App.checkNotifs(); }, 80);
  },
  pushMany(list, type, title, body) { list.forEach(to => Q.push(to, type, title, body)); },

  requestsFor: (driverId) => DB.requests.filter(r => r.driver_id === driverId),
  /* السائق الممتلئ (بلغ عدد الطلاب المسموح) يختفي من بحث الطلبة */
  driversInArea: (area) => DB.drivers.filter(d => {
    if (!d.areas.some(a => arMatch(a, area))) return false;
    const max = d.max_students || d.seats || 0;
    if (max > 0 && (d.students || []).length >= max) return false;
    return true;
  })
};

const App = {
  role: null, user: null, route: 'home', params: {}, stack: [], asStudent: null,
  schoolId: null, lastNotifCount: 0,

  /* الانتقال إلى شاشة جديدة: يُسجّل السابقة في المكدس ليعمل زر الرجوع */
  go(route, params = {}) {
    if (!this.role) return;
    if (this.route === route) { this.params = params; this.render(); return; }   // لا تكرار في المكدس
    this.stack.push({ route: this.route, params: this.params });
    this._syncHistory(true);
    this.route = route; this.params = params;
    this.render();
  },
  /* الرجوع: يعتمد على مكدس التطبيق وعلى تاريخ المتصفح معاً */
  back() {
    if (this.stack.length) {
      const prev = this.stack.pop();
      this.route = prev.route; this.params = prev.params;
      this._syncHistory(false);
      this.render();
      return;
    }
    if (this.role === 'guardian' && this.asStudent) { this.asStudent = null; this.route = 'home'; this.params = {}; this._syncHistory(false); this.render(); return; }
    this.route = 'home'; this.params = {}; this._syncHistory(false); this.render();
  },
  /* تبويب سفلي: يبدأ سلسلة جديدة (بلا مكدس قديم) */
  tab(route) {
    this.route = route; this.params = {}; this.stack = [];
    this._syncHistory(false);
    this.render();
  },
  reset(route = 'home') {
    this.route = route; this.params = {}; this.stack = [];
    this._syncHistory(false); this.render();
  },
  /* مزامنة تاريخ المتصفح حتى يعمل زر الرجوع في النظام أيضاً */
  _syncHistory(push) {
    try {
      const st = { alawael: true, depth: this.stack.length, route: this.route };
      if (push) history.pushState(st, '');
      else history.replaceState(st, '');
    } catch (e) {}
  },

  /* ---------- الجلسة: تبقى محفوظة بعد إغلاق التطبيق ---------- */
  SESSION_KEY: 'alawael.session',
  saveSession() {
    try {
      if (this.role && this.user) localStorage.setItem(this.SESSION_KEY, JSON.stringify({ role: this.role, user: this.user }));
    } catch (e) {}
  },
  restoreSession() {
    try {
      const raw = localStorage.getItem(this.SESSION_KEY);
      if (!raw) return false;
      const s = JSON.parse(raw);
      if (!s || !s.role || !s.user) return false;
      /* تحقّق أن الحساب ما زال موجوداً */
      const ok = s.role === 'admin' ? true
        : s.role === 'student' ? !!Q.student(s.user.studentId)
        : s.role === 'guardian' ? !!Q.guardians().find(g => g.id === s.user.guardianId)
        : s.role === 'teacher' ? !!Q.teacher(s.user.teacherId)
        : s.role === 'driver' ? !!Q.driver(s.user.driverId) : false;
      if (!ok) { localStorage.removeItem(this.SESSION_KEY); return false; }
      this.role = s.role; this.user = s.user; this.asStudent = null;
      this.route = s.role === 'admin' ? 'schools' : 'home'; this.params = {}; this.stack = [];
      return true;
    } catch (e) { return false; }
  },

  logout() {
    Confirm({ title: 'تسجيل الخروج', message: 'هل تريد الخروج من الحساب؟', confirmText: 'خروج', danger: true,
      onYes: () => {
        try { localStorage.removeItem(this.SESSION_KEY); } catch (e) {}
        this.role = null; this.user = null; this.asStudent = null; this.schoolId = null; this.stack = []; this.route = 'home'; this.render();
      } });
  },

  notifOwner() {
    return { student: 'student', guardian: 'student', teacher: 'teacher', driver: 'driver', admin: 'admin' }[this.role] || null;
  },
  checkNotifs() {
    const key = this.notifOwner();
    if (!key) return;
    const n = Q.unread(key);
    if (n > this.lastNotifCount) {
      const latest = Q.notifs(key)[0];
      if (latest && !latest.read) Toast(latest.title, 'ok');
    }
    this.lastNotifCount = n;
    /* الشارة الحمراء على الجرس: عدد الإشعارات غير المقروءة — تُصفَّر عند فتح شاشة الإشعارات */
    const badge = $('#bellBadge');
    if (badge) { badge.textContent = n > 9 ? '9+' : String(n); badge.style.display = n ? 'grid' : 'none'; }
    /* الشارة الحمراء على تبويب الدردشة: عدد الرسائل غير المقروءة — تُصفَّر عند فتح المحادثة */
    const chatN = (typeof Q.unreadMsgs === 'function') ? Q.unreadMsgs() : 0;
    $$('[data-badge="chat"]').forEach(el => {
      el.textContent = chatN > 9 ? '9+' : String(chatN);
      el.style.display = chatN ? 'grid' : 'none';
    });
  },

  render() {
    /* صاحب الحساب الحالي — يُستخدم لعزل الإشعارات والرسائل */
    try {
      DB.viewer = this.role === 'student' ? (this.user && this.user.studentId)
        : this.role === 'guardian' ? (this.asStudent || null)
        : this.role === 'teacher' ? (this.user && this.user.teacherId)
        : this.role === 'driver' ? (this.user && this.user.driverId) : null;
    } catch (e) {}
    if (!this.role) { renderEntry(); return; }
    try { document.getElementById('phone').classList.remove('entry-mode'); } catch (e) {}
    ({ student: renderStudentApp, guardian: renderGuardianApp, teacher: renderTeacherApp,
       driver: renderDriverApp, admin: renderAdminApp }[this.role] || renderStudentApp)();
    setTimeout(() => { try { App.checkNotifs(); } catch (e) {} }, 60);
  }
};

/* ---------- نمط العرض: تلقائي (ليل/نهار) / فاتح / داكن ---------- */
/* الليل من 18:00 حتى 06:00 — التطبيق يبدّل تلقائياً دون تدخل المستخدم */
const AUTO_NIGHT_FROM = 18, AUTO_DAY_FROM = 6;

function themeMode() {
  try {
    const m = localStorage.getItem('alawael.themeMode');
    if (m === 'light' || m === 'dark' || m === 'auto') return m;
  } catch (e) {}
  /* توافق مع الإصدار السابق: من اختار نمطاً يدوياً يبقى عليه */
  try {
    const old = localStorage.getItem('alawael.theme');
    if (old === 'light' || old === 'dark') return old;
  } catch (e) {}
  return 'auto';
}
function autoTheme() {
  const h = new Date().getHours();
  return (h >= AUTO_NIGHT_FROM || h < AUTO_DAY_FROM) ? 'dark' : 'light';
}
function resolveTheme(mode) {
  const m = mode || themeMode();
  return m === 'auto' ? autoTheme() : m;
}
function currentTheme() { return resolveTheme(); }
function applyTheme() {
  const mode = themeMode(), t = resolveTheme(mode);
  try {
    document.documentElement.setAttribute('data-theme', t);
    document.documentElement.setAttribute('data-mode', mode);
    localStorage.setItem('alawael.theme', t);
    localStorage.setItem('alawael.themeMode', mode);   /* ثبّت الوضع المختار */
    const mc = document.querySelector('meta[name="theme-color"]');
    if (mc) mc.setAttribute('content', t === 'dark' ? '#070C18' : '#0A6BFF');
  } catch (e) {}
  return t;
}
function setTheme(mode) {
  try { localStorage.setItem('alawael.themeMode', mode); } catch (e) {}
  applyTheme();
  if (typeof App !== 'undefined' && App.render) App.render();
}
function setThemeMode(mode) { setTheme(mode); }
/* تبديل سريع من زر الشريط: تلقائي ← فاتح ← داكن ← تلقائي */
function cycleTheme() {
  const order = ['auto', 'light', 'dark'];
  const next = order[(order.indexOf(themeMode()) + 1) % 3];
  setTheme(next);
  const names = { auto: 'تلقائي (نهاراً/ليلاً)', light: 'فاتح', dark: 'داكن' };
  try { Toast('نمط العرض: ' + names[next], 'ok'); } catch (e) {}
}
/* فحص دوري: يبدّل النمط تلقائياً عند دخول الليل أو النهار */
function startThemeWatcher() {
  try {
    setInterval(() => {
      if (themeMode() !== 'auto') return;
      if (resolveTheme('auto') === document.documentElement.getAttribute('data-theme')) return;
      applyTheme();
      if (typeof App !== 'undefined' && App.render && !App.asStudent) App.render();
    }, 60000);
    /* عند رجوع التطبيق إلى الواجهة */
    document.addEventListener('visibilitychange', () => { if (!document.hidden && themeMode() === 'auto') applyTheme(); });
  } catch (e) {}
}
function themeIcon(t) { return t === 'dark' ? 'moon' : 'sun'; }
function themeRow() {
  const mode = themeMode(), t = resolveTheme(mode);
  const seg = (id, label, icon) => `<button class="seg-btn ${mode === id ? 'on' : ''}" data-theme-mode="${id}">${ic(icon, 'svg-i')} ${label}</button>`;
  return `<div class="theme-card">
    <div class="row" style="gap:10px;padding:2px 2px 10px">
      <div class="ri y">${ic(themeIcon(t))}</div>
      <div class="rt"><b>نمط العرض</b><span>${mode === 'auto' ? `تلقائي — الآن ${t === 'dark' ? 'داكن (ليل)' : 'فاتح (نهار)'}` : (t === 'dark' ? 'داكن — ثابت' : 'فاتح — ثابت')}</span></div>
    </div>
    <div class="seg3">${seg('auto', 'تلقائي', 'sync')}${seg('light', 'فاتح', 'sun')}${seg('dark', 'داكن', 'moon')}</div>
    <div class="hint" style="margin-top:8px">«تلقائي» يبدّل النمط وحده: داكن بعد 6 مساءً وفاتح من 6 صباحاً.</div>
  </div>`;
}

        cur = r;
        segs.forEach(b => b.classList.toggle('on', b.dataset.lrole === r));
        if (codeEl) codeEl.placeholder = LOGIN_ROLES[r].ph;
        const icEl = ov.querySelector('.lg-field .in-ic');
        if (icEl) icEl.innerHTML = ic(LOGIN_ROLES[r].icon);
        const lbl = ov.querySelector('.lg-field label');
        if (lbl) lbl.textContent = r === 'admin' ? 'اسم المستخدم' : LOGIN_ROLES[r].codeLabel;
        /* استرجاع الكود المحفوظ لهذا النوع من الحساب */
        let saved = '';
        try { saved = localStorage.getItem(REMEMBER_KEY(r)) || ''; } catch (e) {}
        if (saved && codeEl && !codeEl.value) codeEl.value = saved;
        const rem = $('#lgRemember', ov);
        if (rem) rem.checked = !!saved;
      };
      segs.forEach(b => b.onclick = () => setRole(b.dataset.lrole));
      setRole(cur);
      const eye = $('#lgEye', ov);
      if (eye) eye.onclick = () => {
        if (!pwEl) return;
        pwEl.type = pwEl.type === 'password' ? 'text' : 'password';
        eye.innerHTML = ic(pwEl.type === 'password' ? 'eye' : 'eyeOff');
        eye.setAttribute('aria-label', pwEl.type === 'password' ? 'إظهار كلمة المرور' : 'إخفاء كلمة المرور');
      };
      const enterAsAdmin = () => {
        close();
        App.role = 'admin';
        if (!App.user || App.user.role !== 'admin') App.user = { role: 'admin', name: 'مدير النظام' };
        App.stack = []; App.params = {}; App.asStudent = null; App.schoolId = null;
        App.route = 'schools'; App.lastNotifCount = 0;
        try { App.saveSession(); } catch (e) {}
        setTimeout(() => App.render(), 120);
        setTimeout(() => Toast('أهلاً بك في الإدارة', 'ok'), 420);
      };
      const enter = () => {
        close();
        App.role = cur;
        if (!App.user || App.user.role !== cur) App.user = { role: cur };
        App.stack = []; App.params = {}; App.asStudent = null;
        App.route = 'home';
        App.lastNotifCount = 0;
        try { App.saveSession(); } catch (e) {}
        setTimeout(() => App.render(), 120);
        setTimeout(() => Toast('أهلاً بك', 'ok'), 420);
      };
      const cloudOff = () => (typeof CloudApp === 'undefined' || !CloudApp.enabled);
      const loginFail = (m) => Toast(cloudOff() ? m + ' — وقاعدة البيانات غير مربوطة بهذا الجهاز' : m, 'err');
      const doLogin = (code, pw) => {
        code = (code || '').trim(); pw = (pw || '').trim();
        if (!code || !pw) return Toast('أكمل الكود وكلمة المرور', 'err');
        /* حساب الإدارة يُدخَل من مربع الطالب: اسم المستخدم admin + كلمة مروره */
        const adminCfg = (DB.settings && DB.settings.admin) || {};
        if (cur === 'student' && adminCfg.username && code.toLowerCase() === String(adminCfg.username).toLowerCase()
            && pw === String(adminCfg.password || '')) {
          App.role = 'admin'; App.user = { role: 'admin', name: adminCfg.name || 'مدير النظام' };
          return enterAsAdmin();
        }
        if (cur === 'student') {
          const st = DB.students.find(s => s.code === code.toUpperCase() && (s.password || '1234') === pw);
          if (!st) return loginFail('الكود أو كلمة المرور غير صحيحة');
          App.user = { role: cur, studentId: st.id };
        } else if (cur === 'guardian') {
          const gu = Q.guardians().find(g => g.code === code.toUpperCase() && (g.password || '1234') === pw);
          if (!gu) return loginFail('الكود أو كلمة المرور غير صحيحة');
          App.user = { role: cur, guardianId: gu.id };
        } else if (cur === 'teacher') {
          const t = DB.teachers.find(x => x.code === code.toUpperCase() && (x.password || '1234') === pw);
          if (!t) return loginFail('كود المدرس أو كلمة المرور غير صحيحة');
          App.user = { role: cur, teacherId: t.id };
        } else {
          /* كود السائق قد يكون بريداً إلكترونياً — المقارنة غير حساسة لحالة الأحرف */
          const dr = DB.drivers.find(x => String(x.code || '').toLowerCase() === code.toLowerCase() && (x.password || '1234') === pw);
          if (!dr) return loginFail('كود الاشتراك أو كلمة المرور غير صحيحة');
          App.user = { role: cur, driverId: dr.id };
        }
        /* تذكّر الكود إن طلب المستخدم */
        try {
          const rem = $('#lgRemember', ov);
          if (rem && rem.checked) localStorage.setItem(REMEMBER_KEY(cur), code);
          else localStorage.removeItem(REMEMBER_KEY(cur));
        } catch (e) {}
        enter();
      };
      $('#lgGo', ov).onclick = () => doLogin($('#lgCode', ov).value, $('#lgPw', ov).value);
      $('#lgPw', ov).onkeydown = e => { if (e.key === 'Enter') doLogin($('#lgCode', ov).value, $('#lgPw', ov).value); };
      $('#lgCode', ov).onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $('#lgPw', ov).focus(); } };
      setTimeout(() => { const c = $('#lgCode', ov); if (c && !c.value) c.focus(); }, 320);
    }
  });
}

const STUDENT_TABS = [['home','home','الرئيسية'],['homework','clip','الواجبات'],['chat','chat','الدردشة'],['more','grid','المزيد']];

function studentOf() {
  if (App.role === 'student') return Q.student(App.user.studentId);
  if (App.asStudent) return Q.student(App.asStudent);
  return null;
}

function renderStudentApp() {
  const st = studentOf();
  if (!st) return renderGuardianHome();
  const r = App.route;
  const map = { home: studentHome, homework: studentHomework, grades: studentGrades, absences: studentAbsences, chat: studentChat,
    thread: studentThread, schedule: studentSchedule, monthSchedule: studentMonthSchedule,
    subs: studentSubs, about: studentAbout, notifs: studentNotifs, more: studentMore };
  $('#app').innerHTML = (map[r] || studentHome)(st);
  bindStudent(st);
  /* زر «العودة إلى قائمة أبنائك» يظهر في الرئيسية فقط */
  if (App.role === 'guardian' && App.route === 'home') {
    const sc = $('#app .scroll');
    if (sc) {
      sc.insertAdjacentHTML('afterbegin', `<button class="note yellow" id="backKids" style="width:100%;text-align:start;border:0;margin-bottom:10px">
        ${ic('back')}<div><b>عرض ابنك: ${esc(st.name)}</b><br>اضغط للعودة إلى قائمة أبنائك</div></button>`);
      $('#backKids').onclick = () => { App.asStudent = null; App.reset('home'); };
    }
  }
}

/* ---------- الدرجات ---------- */
function studentGrades(st) {
  /* حجب الدرجات من الإدارة: تُخفى الشاشتان (اليومية والشهرية) بالكامل */
  const block = Q.gradeBlockOf(st.id);
  if (block) {
    return `<div class="screen">
      ${navbar({ title: 'الدرجات', sub: 'درجاتي اليومية والشهرية', right: `${themeBtn()}${bellBtn()}` })}
      <div class="scroll">
        <div class="blocked-note">
          <div class="bn-ic">${ic('lock')}</div>
          <div>
            <h4>درجتك محجوبة</h4>
            <p>قرّرت إدارة المدرسة إخفاء درجتك اليومية والشهرية من التطبيق. لا يمكن عرض الأرقام حالياً.</p>
            ${block.reason ? `<div class="bn-reason">السبب: ${esc(block.reason)}</div>` : ''}
            <div class="bn-reason">للاستفسار راجع إدارة المدرسة — ${esc(Q.label.school(st.school_id))}</div>
          </div>
        </div>
        <div class="note blue mt-12">${ic('info')}<div>بقية أقسام التطبيق (الواجبات، الجدول، الدردشة، الإشعارات) متاحة كالمعتاد.</div></div>
      </div>
      ${tabbar(STUDENT_TABS, 'home')}
    </div>`;
  }
  const daily = Q.dailyExamsFor(st)
    .map(e => ({ ...e, value: Q.examGrade(e.id, st.id) }))
    .filter(e => e.value != null)
    .sort((a, b) => String(b.date).localeCompare(String(a.date)));
  /* الدرجات الشهرية: لكل فترة (الشهر الأول، الثاني، نصف السنة، آخر السنة) */
  const monthly = PERIODS
    .map(per => ({ per, rows: DB.monthlyGrades.filter(g => g.student_id === st.id && g.period === per.id) }))
    .filter(x => x.rows.length);
  return `<div class="screen">
    ${navbar({ title: 'الدرجات', sub: 'درجاتي اليومية والشهرية', right: `${themeBtn()}${bellBtn()}` })}
    <div class="scroll">
      ${monthly.length ? `<div class="sec-title">الدرجات الشهرية</div>
      ${monthly.map(({ per, rows }) => `<div class="card">
        <div class="card-head"><h3>${ic('chart')} ${esc(per.label)}</h3></div>
        ${rows.map(g => {
          const v = +g.value || 0, max = +g.max || 100, ratio = max ? v / max : 0;
          return `<div class="g-line"><span class="gn">${esc(Q.subject(g.subject_id)?.name || '—')}</span>
            <span class="gv" style="color:${ratio >= .85 ? 'var(--green)' : ratio >= .6 ? 'var(--blue)' : 'var(--red)'}">${v}<span class="small muted"> / ${max}</span></span></div>`;
        }).join('')}
      </div>`).join('')}` : ''}
      ${daily.length ? `<div class="sec-title">الدرجات اليومية</div>` : ''}
      ${daily.length ? daily.map(e => {
        const max = +e.max || 100;
        const v = e.value, ratio = v / max;
        return `<div class="g-card">
          <div class="g-head">
            <div class="gi">${ic('book')}</div>
            <div class="grow"><b>${esc(Q.subject(e.subject_id)?.name || '—')}</b>
              <div class="small muted" style="font-weight:700;margin-top:2px">${esc(e.name || 'امتحان')} · ${fmtDate(e.date)}</div></div>
            <div style="text-align:end"><div style="font-size:19px;font-weight:800;color:${ratio >= .85 ? 'var(--green)' : ratio >= .6 ? 'var(--blue)' : 'var(--red)'}">${v}</div>
              <div class="small muted" style="font-weight:800">من ${max}</div></div>
          </div>
          <div class="bar" style="width:100%"><i class="${ratio >= .85 ? 'ok' : ratio >= .6 ? '' : 'bad'}" style="width:${Math.max(4, Math.round(ratio * 100))}%"></i></div>
        </div>`;
      }).join('') : empty('chart', 'لا توجد درجات يومية', 'ستظهر هنا بعد إدخالها من الإدارة')}
    </div>
    ${tabbar(STUDENT_TABS, 'home')}
  </div>`;
}

/* ---------- الجدول اليومي (مرتّب وهادئ) ---------- */
function studentSchedule(st) {
  const week = Q.weeklyFor(st.section_id);
  const todayDow = new Date().getDay();
  /* كل الأيام الخمسة تظهر دائماً (الأحد..الخميس) كما في اللوحة — حتى لو كان اليوم فارغاً */
  const days = week.map((w, i) => ({ w, i }));
  const withSubjects = days.filter(d => (d.w.periods || []).some(p => p.subject_id));
  const defaultDay = todayDow <= 4 ? todayDow : (withSubjects.length ? withSubjects[0].i : 0);
  const sel = App.params.day != null ? +App.params.day : defaultDay;
  const day = week[sel] || week[0];
  return `<div class="screen">
    ${navbar({ title: 'الجدول اليومي', sub: `${Q.label.grade(st.grade_id)} — شعبة ${Q.label.section(st.section_id)}`, back: true, right: `${themeBtn()}${bellBtn()}` })}
    <div class="scroll">
      <div class="chips wrap mb-12">
        ${days.map(({ w, i }) => `<button class="chip ${i === sel ? 'on' : ''}" data-day-tab="${i}">${w.name}
          ${i === todayDow ? '<span class="d">اليوم</span>' : '<span class="d">&nbsp;</span>'}</button>`).join('')}
      </div>
      <div class="list">
        ${(day.periods || []).map((p, i) => `<div class="per-row">
          <div class="per-no ${i % 2 ? 'y' : ''}">${p.no}</div>
          <div class="per-t"><b>${esc(p.subject_id ? (Q.subject(p.subject_id)?.name || '—') : 'لا توجد حصة')}</b>
            ${p.teacher_id ? `<span>${esc(Q.teacher(p.teacher_id)?.name || '')}</span>` : ''}</div>
        </div>`).join('')}
      </div>
      <div class="note blue mt-12">${ic('info')}<div>جدول شعبتك كما هو مضاف من المدرسة — اختر اليوم من الأعلى.</div></div>
    </div>
    ${tabbar(STUDENT_TABS, 'home')}
  </div>`;
}

/* ---------- الجدول الشهري (اختيار الامتحان ثم الجدول) ---------- */
function studentMonthSchedule(st) {
  const schoolExams = Q.monthExamsOf(st.school_id);
  const periods = PERIODS.filter(p => schoolExams.some(e => e.period === p.id));
  const sel = App.params.period;
  if (!sel) {
    return `<div class="screen">
      ${navbar({ title: 'الجدول الشهري', sub: 'اختر الامتحان أولاً', back: true, right: `${themeBtn()}${bellBtn()}` })}
      <div class="scroll">
        <div class="note yellow">${ic('calendar')}<div>اختر الامتحان (الشهر الأول، الثاني، نصف السنة، آخر السنة) لتظهر مواعيد المواد والمواد الداخلة في الامتحان.</div></div>
        ${periods.map(p => {
          const list = schoolExams.filter(e => e.period === p.id);
          return `<button class="school-card" data-period="${p.id}">
            <div class="si" style="background:var(--yellow-soft);color:var(--yellow-2)">${ic('calendar')}</div>
            <div class="grow"><b>${p.label}</b><span>${list.length} مادة · يبدأ ${fmtDate(list[0]?.date)}</span></div>
            <span class="chev"></span></button>`;

/* تعليم كل إشعارات هذا الحساب كمقروءة (يُستدعى عند فتح شاشة الإشعارات) */
/* الإشعارات المقروءة تُحفظ في الجهاز حتى لا تعود «جديدة» بعد إعادة الدخول */
const ReadStore = {
  KEY: 'alawael.readNotifs',
  get() { try { return JSON.parse(localStorage.getItem(this.KEY) || '[]'); } catch (e) { return []; } },
  add(ids) {
    try {
      const cur = new Set(this.get());
      ids.forEach(i => cur.add(i));
      localStorage.setItem(this.KEY, JSON.stringify([...cur].slice(-600)));
    } catch (e) {}
  },
  apply(list) {
    const set = new Set(this.get());
    list.forEach(n => { if (set.has(n.id)) n.read = true; });
    return list;
  }
};

function markNotifsRead() {
  const to = App.notifOwner();
  if (!to) return 0;
  let n = 0;
  const ids = [];
  DB.notifications.forEach(x => {
    if (x.to === to && !x.read && (!x.owner || !DB.viewer || x.owner === DB.viewer)) { x.read = true; n++; ids.push(x.id); }
  });
  if (ids.length) ReadStore.add(ids);
  if (n) { Store.save(); App.lastNotifCount = Q.unread(to); }
  const badge = document.querySelector('#bellBadge');
  const left = Q.unread(to);
  if (badge) { badge.textContent = left > 9 ? '9+' : String(left); badge.style.display = left ? 'grid' : 'none'; }
  /* تصفير الشارات الحمراء على أيقونات الرئيسية (الإشعارات/الدردشة) */
  $$('.tile').forEach(el => {
    const act = el.dataset.act;
    if (act === 'notifs' || act === 'homework') {
      const b = el.querySelector('.tab-badge');
      if (b) b.style.display = 'none';
    }
  });
  return n;
}

function bindStudent(st) {
  bindCommon(st);
  $$('[data-day]').forEach(b => b.onclick = () => { App.params = { date: b.dataset.day }; App.render(); });
  $$('[data-day-tab]').forEach(b => b.onclick = () => { App.params = { day: b.dataset.dayTab }; App.render(); });
  $$('[data-gtab]').forEach(b => b.onclick = () => { App.params = { tab: b.dataset.gtab }; App.render(); });
  $$('[data-period]').forEach(b => b.onclick = () => { App.params = { period: b.dataset.period }; App.render(); });
  $$('[data-thread]').forEach(b => b.onclick = () => App.go('thread', { id: b.dataset.thread }));
  $$('[data-area]').forEach(b => b.onclick = () => { App.params = { q: b.dataset.area }; App.render(); });
  const aq = $('#areaQ');
  if (aq) aq.oninput = debounce(() => {
    App.params = { q: aq.value }; App.render();
    setTimeout(() => { const el = $('#areaQ'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }, 30);
  }, 320);
  $$('[data-add-driver]').forEach(b => b.onclick = () => addDriverRequest(st, b.dataset.addDriver));
  $$('[data-leave-driver]').forEach(b => b.onclick = () => leaveDriver(st, b.dataset.leaveDriver));
  const out = $('#logoutBtn'); if (out) out.onclick = () => App.logout();
  if (App.route === 'thread') {
    const box = $('#msgBox'), send = $('#sendMsg');
    const att = createAttachBox();
    att.el = $('#attStrip');
    bindAttachUI(document, att);
    if (send) {
      const th = DB.threads.find(t => t.id === App.params.id) || Q.threadAdmin(st.id);
      const doSend = () => {
        const text = box.value.trim();
        const atts = att.list.slice();
        if (!text && !atts.length) return;
        box.value = '';
        att.clear();
        Q.sendMsg(th.id, 'me', text || '(مرفق)', { unread: 1, attachments: atts });
        const brief = text ? text.slice(0, 60) : `مرفق${atts.length > 1 ? ' (' + atts.length + ')' : ''}`;
        if (th.kind === 'admin') Q.push('admin', 'message', 'رسالة جديدة من طالب', `${st.name}: ${brief}`);
        else Q.push('teacher', 'message', 'رسالة من طالب', `${st.name}: ${brief}`);
        App.render();
        setTimeout(() => { const b = $('#chatBody'); if (b) b.scrollTop = b.scrollHeight; }, 40);
        /* الرد التلقائي: على أول رسالة فقط، ثم يُمنع لمدة ساعتين (أو المدة المحددة في اللوحة)
           حتى يتبادل الطالب والإدارة الكلام بحرية، وبعد انتهاء المدة يعود الرد التلقائي */
        const ar = (DB.settings && DB.settings.autoReply) || null;
        if (th.kind === 'admin' && ar && ar.enabled && String(ar.text || '').trim()) {
          const cooldown = (Number(ar.cooldownHours) > 0 ? Number(ar.cooldownHours) : 2) * 3600e3;
          const msgs = Q.msgs(th.id);
          const lastAuto = [...msgs].reverse().find(m => m.auto);
          const lastStudent = [...msgs].reverse().find(m => m.from === 'me');
          const due = !lastAuto || (lastStudent && new Date(lastStudent.at).getTime() > new Date(lastAuto.at).getTime() + cooldown);
          if (due) {
            setTimeout(() => {
              const cur = DB.threads.find(t => t.id === th.id);
              Q.sendMsg(th.id, 'admin', String(ar.text).trim(), { unread: cur ? (cur.unread || 0) : 0, auto: true });
              if (App.route === 'thread' && App.params.id === th.id) {
                App.render();
                setTimeout(() => { const b = $('#chatBody'); if (b) b.scrollTop = b.scrollHeight; }, 40);
              }
            }, 1200);
          }
        }
      };
      send.onclick = doSend;
      box.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); } };
      setTimeout(() => { const b = $('#chatBody'); if (b) b.scrollTop = b.scrollHeight; }, 30);
    }
  }
}

function bindCommon(ctx) {
  $$('[data-back]').forEach(b => b.onclick = (e) => { e.preventDefault(); e.stopPropagation(); App.back(); });
  $$('[data-act]').forEach(b => b.onclick = (e) => {
    e.preventDefault(); e.stopPropagation();
    const a = b.dataset.act;
    if (a === 'hw_new') return openNewHomework();
    App.go(a);
  });
  /* التبويب السفلي: يبقى داخل حساب الابن عند ولي الأمر، ويبدأ سلسلة جديدة دائماً */
  $$('[data-tab]').forEach(b => b.onclick = (e) => {
    e.preventDefault(); e.stopPropagation();
    App.tab(b.dataset.tab);
  });
  /* تشغيل إشعارات الجوال */
  const pbtn = $('#pushOn');
  if (pbtn) pbtn.onclick = async (e) => {
    e.preventDefault();
    try { await PushSetup.enable(); } catch (err) { Toast('تعذّر تفعيل الإشعارات', 'err'); }
    App.render();
  };
  /* تبديل نمط العرض: تلقائي ← فاتح ← داكن */
  $$('[data-theme-toggle]').forEach(b => b.onclick = (e) => {
    e.preventDefault(); e.stopPropagation();
    cycleTheme();
  });
  /* اختيار النمط من صف الإعدادات */
  $$('[data-theme-mode]').forEach(b => b.onclick = (e) => {
    e.preventDefault(); e.stopPropagation();
    setTheme(b.dataset.themeMode);
  });
  /* شاشات الإشعارات: تُعلَّم مقروءة فور فتحها */
  if (App.route === 'notifs') setTimeout(() => { try { markNotifsRead(); } catch (e) {} }, 120);
  const readAll = $('#readAll');
  if (readAll) readAll.onclick = () => {
    DB.notifications.filter(n => n.to === App.notifOwner()).forEach(n => n.read = true);
    Store.save(); App.render();
  };
  ['#logoutBtn', '#logoutAdmin', '#logoutAdmin2', '#dLogout', '#tLogout', '#gLogout'].forEach(sel => {
    const el = $(sel); if (el) el.onclick = () => App.logout();
  });
}

/* المدرس عام: إسنادات (مدرسة + مادة + صف + شعبة). متوافق مع المدرسين القدامى (مادة/شعبة واحدة) */
function teacherAssignments(t) {
  if (Array.isArray(t.assignments) && t.assignments.length) return t.assignments;
  const subs = (t.subject_ids && t.subject_ids.length) ? t.subject_ids : (t.subject_id ? [t.subject_id] : []);
  const secs = t.section_ids || [];
  const schools = (t.school_ids && t.school_ids.length) ? t.school_ids : (t.school_id ? [t.school_id] : []);
  const out = [];
  if (secs.length) {
    secs.forEach(sid => {
      const sec = Q.section(sid);
      out.push({ school_id: sec?.school_id || schools[0] || null, subject_id: subs[0] || null,
        grade_id: sec?.grade_id || t.grade_id || null, section_id: sid });
    });
  } else {
    subs.forEach(sub => out.push({ school_id: schools[0] || null, subject_id: sub, grade_id: t.grade_id || null, section_id: null }));
  }
  return out;
}
function teacherSubjectIds(t) {
  const ids = (teacherAssignments(t) || []).map(a => a.subject_id).filter(Boolean);
  if (!ids.length && t.subject_id) ids.push(t.subject_id);
  return [...new Set(ids)];
}
function teacherSchoolIds(t) {
  const ids = (teacherAssignments(t) || []).map(a => a.school_id).filter(Boolean);
  if (!ids.length && t.school_id) ids.push(t.school_id);
  return [...new Set(ids)];
}
function teacherSections(t) {
  const ids = [...new Set((teacherAssignments(t) || []).map(a => a.section_id).filter(Boolean))];
  return ids.map(id => Q.section(id)).filter(Boolean);
}
function teacherStudents(t) {
  const ids = teacherSections(t).map(s => s.id);
  const seen = new Set();
  return DB.students.filter(s => ids.includes(s.section_id))
    .filter(s => (seen.has(s.id) ? false : seen.add(s.id)))
    .sort((a, b) => (a.order || 0) - (b.order || 0));
}
/* شعب مادة معيّنة للمدرس (عند اختيار المادة أثناء إنشاء واجب) */
function teacherSectionsFor(t, subjectId, gradeId) {
  const as = teacherAssignments(t).filter(a => !subjectId || a.subject_id === subjectId);
  const ids = as.map(a => a.section_id).filter(Boolean);
  return teacherSections(t).filter(sec => ids.includes(sec.id) && (!gradeId || sec.grade_id === gradeId));
}
function teacherGradeIds(t) {
  const fromAs = (teacherAssignments(t) || []).map(a => a.grade_id).filter(Boolean);
  if (fromAs.length) return [...new Set(fromAs)];
  const secs = teacherSections(t);
  return [...new Set(secs.map(s => s.grade_id).filter(Boolean))];
}
