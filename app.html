/* تعليم كل إشعارات هذا الحساب كمقروءة (يُستدعى عند فتح شاشة الإشعارات) */
/* الإشعارات المقروءة تُحفظ في الجهاز حتى لا تعود «جديدة» بعد إعادة الدخول */
const ReadStore = {
  KEY: 'alawael.readNotifs',
  get() { try { return JSON.parse(localStorage.getItem(this.KEY) || '[]'); } catch (e) { return []; } },
  add(ids) {
    try {
      const cur = new Set(this.get());
      ids.forEach(i => cur.add(i));
      localStorage.setItem(this.KEY, JSON.stringify([...cur].slice(-600)));
    } catch (e) {}
  },
  apply(list) {
    const set = new Set(this.get());
    list.forEach(n => { if (set.has(n.id)) n.read = true; });
    return list;
  }
};

function markNotifsRead() {
  const to = App.notifOwner();
  if (!to) return 0;
  let n = 0;
  const ids = [];
  DB.notifications.forEach(x => {
    if (x.to === to && !x.read && (!x.owner || !DB.viewer || x.owner === DB.viewer)) { x.read = true; n++; ids.push(x.id); }
  });
  if (ids.length) ReadStore.add(ids);
  if (n) { Store.save(); App.lastNotifCount = Q.unread(to); }
  const badge = document.querySelector('#bellBadge');
  const left = Q.unread(to);
  if (badge) { badge.textContent = left > 9 ? '9+' : String(left); badge.style.display = left ? 'grid' : 'none'; }
  /* تصفير الشارات الحمراء على أيقونات الرئيسية (الإشعارات/الدردشة) */
  $$('.tile').forEach(el => {
    const act = el.dataset.act;
    if (act === 'notifs' || act === 'homework') {
      const b = el.querySelector('.tab-badge');
      if (b) b.style.display = 'none';
    }
  });
  return n;
}

function bindStudent(st) {
  bindCommon(st);
  $$('[data-day]').forEach(b => b.onclick = () => { App.params = { date: b.dataset.day }; App.render(); });
  $$('[data-day-tab]').forEach(b => b.onclick = () => { App.params = { day: b.dataset.dayTab }; App.render(); });
  $$('[data-gtab]').forEach(b => b.onclick = () => { App.params = { tab: b.dataset.gtab }; App.render(); });
  $$('[data-period]').forEach(b => b.onclick = () => { App.params = { period: b.dataset.period }; App.render(); });
  $$('[data-thread]').forEach(b => b.onclick = () => App.go('thread', { id: b.dataset.thread }));
  $$('[data-area]').forEach(b => b.onclick = () => { App.params = { q: b.dataset.area }; App.render(); });
  const aq = $('#areaQ');
  if (aq) aq.oninput = debounce(() => {
    App.params = { q: aq.value }; App.render();
    setTimeout(() => { const el = $('#areaQ'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }, 30);
  }, 320);
  $$('[data-add-driver]').forEach(b => b.onclick = () => addDriverRequest(st, b.dataset.addDriver));
  const out = $('#logoutBtn'); if (out) out.onclick = () => App.logout();
  if (App.route === 'thread') {
    const box = $('#msgBox'), send = $('#sendMsg');
    if (send) {
      const th = DB.threads.find(t => t.id === App.params.id) || Q.threadAdmin(st.id);
      const doSend = () => {
        const text = box.value.trim(); if (!text) return;
        box.value = '';
        Q.sendMsg(th.id, 'me', text, { unread: 1 });
        if (th.kind === 'admin') Q.push('admin', 'message', 'رسالة جديدة من طالب', `${st.name}: ${text.slice(0, 60)}`);
        else Q.push('teacher', 'message', 'رسالة من طالب', `${st.name}: ${text.slice(0, 60)}`);
        App.render();
        setTimeout(() => { const b = $('#chatBody'); if (b) b.scrollTop = b.scrollHeight; }, 40);
        /* الرد التلقائي: على أول رسالة فقط، ثم يُمنع لمدة ساعتين (أو المدة المحددة في اللوحة)
           حتى يتبادل الطالب والإدارة الكلام بحرية، وبعد انتهاء المدة يعود الرد التلقائي */
        const ar = (DB.settings && DB.settings.autoReply) || null;
        if (th.kind === 'admin' && ar && ar.enabled && String(ar.text || '').trim()) {
          const cooldown = (Number(ar.cooldownHours) > 0 ? Number(ar.cooldownHours) : 2) * 3600e3;
          const msgs = Q.msgs(th.id);
          const lastAuto = [...msgs].reverse().find(m => m.auto);
          const lastStudent = [...msgs].reverse().find(m => m.from === 'me');
          const due = !lastAuto || (lastStudent && new Date(lastStudent.at).getTime() > new Date(lastAuto.at).getTime() + cooldown);
          if (due) {
            setTimeout(() => {
              const cur = DB.threads.find(t => t.id === th.id);
              Q.sendMsg(th.id, 'admin', String(ar.text).trim(), { unread: cur ? (cur.unread || 0) : 0, auto: true });
              if (App.route === 'thread' && App.params.id === th.id) {
                App.render();
                setTimeout(() => { const b = $('#chatBody'); if (b) b.scrollTop = b.scrollHeight; }, 40);
              }
            }, 1200);
          }
        }
      };
      send.onclick = doSend;
      box.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); } };
      setTimeout(() => { const b = $('#chatBody'); if (b) b.scrollTop = b.scrollHeight; }, 30);
    }
  }
}

  $$('[data-tab]').forEach(b => b.onclick = (e) => {

  });
  /* تشغيل إشعارات الجوال */

    try { await PushSetup.enable(); } catch (err) { Toast('تعذّر تفعيل الإشعارات', 'err'); }

  /* تبديل نمط العرض (داكن/فاتح) */

    setTheme(currentTheme() === 'dark' ? 'light' : 'dark');
  });
  /* شاشات الإشعارات: تُعلَّم مقروءة فور فتحها */
  if (App.route === 'notifs') setTimeout(() => { try { markNotifsRead(); } catch (e) {} }, 120);
  const readAll = $('#readAll');
  if (readAll) readAll.onclick = () => {
    DB.notifications.filter(n => n.to === App.notifOwner()).forEach(n => n.read = true);
    Store.save(); App.render();
  };
  ['#logoutBtn', '#logoutAdmin', '#logoutAdmin2', '#dLogout', '#tLogout', '#gLogout'].forEach(sel => {
    const el = $(sel); if (el) el.onclick = () => App.logout();

function homeworkEditor({ teacher = null, editing = null, onSave }) {
  const isAdmin = !teacher;
  const grades = isAdmin
    ? Q.gradesOf(App.schoolId)
    : [Q.grade(teacher.grade_id)].filter(Boolean);
  const startGrade = editing?.grade_id || grades.find(g => Q.studentsOfGrade(g.id).length)?.id || grades[0]?.id;
  const startSecs = editing?.section_ids || (teacher ? teacher.section_ids : []);
  Sheet.open({
    title: editing ? 'تعديل الواجب' : 'إضافة واجب',
    sub: 'اختر الصف ثم الشعب ثم تفاصيل الواجب',
    body: `
      <div class="field"><label>${isAdmin ? 'الصف' : 'الصف (المادة: ' + esc(Q.subject(teacher.subject_id)?.name) + ')'}</label>
        <select class="input" id="hwGrade">
          ${grades.map(g => `<option value="${g.id}" ${g.id === startGrade ? 'selected' : ''}>${esc(g.name)}</option>`).join('')}
        </select></div>
      <div class="field"><label>الشعب <span class="chk-count" id="secCount"></span></label>
        <div class="pick" id="hwSecs"></div>
        ${isAdmin ? '' : `<div class="hint">تظهر فقط الشعب التي تدرّسها.</div>`}</div>
      ${isAdmin ? `<div class="field"><label>المادة</label><select class="input" id="hwSubject">
        ${DB.subjects.map(s => `<option value="${s.id}" ${editing?.subject_id === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}
      </select></div>` : ''}
      <div class="field"><label>نص الواجب</label><textarea class="input" id="hwText" placeholder="اكتب نص الواجب…">${esc(editing?.text || '')}</textarea></div>
      <div class="field"><label>المرفقات</label>
        <div class="rowx" style="gap:8px;flex-wrap:wrap">
          <button class="btn soft sm" id="hwImg">${ic('image')} <span id="hwImgT">صور (${editing?.images || 0})</span></button>
          <button class="btn soft sm" id="hwPdf">${ic('file')} <span id="hwPdfT">${editing?.pdf ? esc(editing.pdf) : 'PDF'}</span></button>
        </div>
        <div class="field mt-12" style="margin-bottom:0"><label>رابط (اختياري)</label>
          <input class="input" id="hwLink" dir="ltr" placeholder="https://…" value="${esc(editing?.link || '')}"></div>
      </div>`,
    actions: `<button class="btn" id="hwSend">${ic('send')} ${editing ? 'حفظ التعديل' : 'إرسال للطلبة'}</button>`,
    onMount(ov, close) {
      let images = editing?.images || 0;
      let pdf = editing?.pdf || '';
      const gSel = $('#hwGrade', ov), secBox = $('#hwSecs', ov);
      let picked = new Set(startSecs);
      const drawSecs = () => {
        const secs = Q.sectionsOf(gSel.value).filter(s => !teacher || (teacher.section_ids || []).includes(s.id));
        picked = new Set([...picked].filter(id => secs.some(s => s.id === id)));
        if (!picked.size) secs.forEach(s => picked.add(s.id));
        secBox.innerHTML = secs.map(s => `<div class="pick-row ${picked.has(s.id) ? 'on' : ''}" data-sec="${s.id}">
          <div class="cb">${ic('check')}</div>
          <div class="pt"><b>شعبة ${esc(s.name)}</b><span>${Q.studentsOf(s.id).length} طالب</span></div>
        </div>`).join('') || `<div style="padding:12px" class="small muted bold">لا شعب</div>`;
        $$('.pick-row', secBox).forEach(rw => rw.onclick = () => {
          if (picked.has(rw.dataset.sec)) picked.delete(rw.dataset.sec); else picked.add(rw.dataset.sec);
          rw.classList.toggle('on');
          $('#secCount', ov).textContent = `(${picked.size} مختارة)`;
        });
        $('#secCount', ov).textContent = `(${picked.size} مختارة)`;
      };
      gSel.onchange = drawSecs;
      drawSecs();
      $('#hwImg', ov).onclick = () => { images = images ? 0 : 2; $('#hwImgT', ov).textContent = `صور (${images})`; };
      $('#hwPdf', ov).onclick = () => { pdf = pdf ? '' : 'ورقة عمل.pdf'; $('#hwPdfT', ov).textContent = pdf || 'PDF'; };
      $('#hwSend', ov).onclick = () => {
        const text = $('#hwText', ov).value.trim();
        if (!picked.size) return Toast('اختر شعبة واحدة على الأقل', 'err');
        if (text.length < 5) return Toast('اكتب نص الواجب', 'err');
        onSave({
          grade_id: gSel.value, section_ids: [...picked], text, images, pdf,
          link: $('#hwLink', ov).value.trim(),
          subject_id: isAdmin ? $('#hwSubject', ov).value : teacher.subject_id
        });
        close();
      };
    }
  });
}

function sendHomeworkNotif(h, isNew = true) {
  const subj = Q.subject(h.subject_id)?.name || '';
  Q.push('student', 'homework', `${isNew ? 'واجب جديد' : 'تعديل واجب'} — ${subj}`, h.text.slice(0, 70));
}

function bindTeacher(t) {
  $$('[data-msg-student]').forEach(b => b.onclick = () => {
    const th = Q.threadTeacher(t.id, b.dataset.msgStudent);
    App.go('thread', { id: th.id });
  });
  $$('[data-thread]').forEach(b => b.onclick = () => App.go('thread', { id: b.dataset.thread }));
  $$('[data-edit-hw]').forEach(b => b.onclick = () => {
    const h = DB.homeworks.find(x => x.id === b.dataset.editHw); if (!h) return;
    homeworkEditor({ teacher: t, editing: h, onSave: patch => {
      Object.assign(h, patch); sendHomeworkNotif(h, false); Store.save();
      Toast('تم تعديل الواجب وإشعار الطلبة ✓', 'ok'); App.render();
    } });
  });
  if (App.route === 'thread') {
    const th = DB.threads.find(x => x.id === App.params.id);
    const box = $('#msgBox'), send = $('#sendMsg');
    if (send && th) {
      const doSend = () => {
        const text = box.value.trim(); if (!text) return;
        Q.sendMsg(th.id, 'staff', text, { unread: 0 });
        Q.push('student', 'message', `رسالة من ${t.name}`, text.slice(0, 60));
        App.render();
        setTimeout(() => { const b = $('#chatBody'); if (b) b.scrollTop = b.scrollHeight; }, 40);
      };
      send.onclick = doSend;
      box.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); } };
      setTimeout(() => { const b = $('#chatBody'); if (b) b.scrollTop = b.scrollHeight; }, 30);
    }
  }
}

function decideRequest(d, id, dec) {
  const r = DB.requests.find(x => x.id === id); if (!r) return;
  r.status = dec;
  const s = Q.student(r.student_id);
  if (dec === 'accepted') {
    d.students = d.students || [];
    if (!d.students.includes(r.student_id)) d.students.push(r.student_id);
    Q.push('student', 'admin', 'تم قبول طلب الاشتراك', `${d.name} قبل طلبك — رقمه: ${d.phone}`);
  } else {
    Q.push('student', 'admin', 'تم رفض طلب الاشتراك', `اعتذر ${d.name} عن طلبك، يمكنك اختيار سائق آخر.`);
  }
  Store.save();
  Toast(dec === 'accepted' ? 'تم قبول الطالب ✓' : 'تم رفض الطلب', dec === 'accepted' ? 'ok' : '');
  App.render();
}

function openSendNotif(studentIds) {
  if (!studentIds.length) return Toast('حدد طالباً واحداً على الأقل', 'err');
  Sheet.open({
    title: 'إرسال إشعار',
    sub: `${studentIds.length} طالب`,
    body: `<div class="field"><label>العنوان</label><input class="input" id="snTitle" placeholder="مثال: موعد الاختبار"></div>
      <div class="field"><label>النص</label><textarea class="input" id="snBody" placeholder="اكتب نص الإشعار…"></textarea></div>`,
    actions: `<button class="btn" id="snSend">${ic('send')} إرسال</button>`,
    onMount(ov, close) {
      $('#snSend', ov).onclick = () => {
        const t = $('#snTitle', ov).value.trim(), b = $('#snBody', ov).value.trim();
        if (t.length < 3 || b.length < 3) return Toast('أكمل العنوان والنص', 'err');
        const names = studentIds.map(id => Q.student(id)?.name).filter(Boolean);
        Q.push('student', 'admin', t, `${b} — (${names.slice(0, 2).join('، ')}${names.length > 2 ? ' وآخرون' : ''})`);
        Store.save(); close(); Toast('أُرسل الإشعار ✓', 'ok'); App.render();
      };
    }
  });
}

function openSendMessage(studentIds) {
  if (!studentIds.length) return Toast('حدد طالباً واحداً على الأقل', 'err');
  Sheet.open({
    title: 'إرسال رسالة',
    sub: `${studentIds.length} طالب — تظهر في دردشة كل طالب`,
    body: `<div class="field"><label>الرسالة</label><textarea class="input" id="smBody" placeholder="اكتب رسالتك…"></textarea></div>`,
    actions: `<button class="btn" id="smSend">${ic('send')} إرسال</button>`,
    onMount(ov, close) {
      $('#smSend', ov).onclick = () => {
        const b = $('#smBody', ov).value.trim();
        if (b.length < 2) return Toast('اكتب الرسالة', 'err');
        studentIds.forEach(id => {
          const th = Q.threadAdmin(id);
          Q.sendMsg(th.id, 'staff', b, { unread: 1 });
          Q.push('student', 'message', 'رسالة من الإدارة', b.slice(0, 60));
        });
        Store.save(); close(); Toast('أُرسلت الرسالة ✓', 'ok'); App.render();
      };
    }
  });
}

/* ---------- ربط أحداث الإدارة (الجزء الأول) ---------- */
function bindAdmin() {
  $$('[data-grade]').forEach(b => b.onclick = () => { App.params = { grade: b.dataset.grade }; App.render(); });
  $$('[data-section]').forEach(b => b.onclick = () => { App.params = { grade: App.params.grade, section: b.dataset.section, sel: [] }; App.render(); });
  $$('[data-pick]').forEach(b => b.onclick = () => {
    const set = new Set(App.params.sel || []);
    if (set.has(b.dataset.pick)) set.delete(b.dataset.pick); else set.add(b.dataset.pick);
    App.params.sel = [...set];
    b.classList.toggle('on');
    const cnt = $('.chk-count'); if (cnt) cnt.textContent = `${set.size} طالب محدد`;
  });
  const allBtn = $('#selAll');
  if (allBtn) allBtn.onclick = () => {
    const sts = Q.studentsOf(App.params.section).map(s => s.id);
    const set = new Set(App.params.sel || []);
    const allOn = sts.every(id => set.has(id));
    App.params.sel = allOn ? [] : sts;
    App.render();
  };
  const msgBtn = $('#sendMsgSel'); if (msgBtn) msgBtn.onclick = () => openSendMessage(App.params.sel || []);
  const notifBtn = $('#sendNotifSel'); if (notifBtn) notifBtn.onclick = () => openSendNotif(App.params.sel || []);

  $$('[data-new-hw]').forEach(b => b.onclick = () => homeworkEditor({ teacher: null, onSave: patch => {
    const h = { id: uid('hw'), school_id: App.schoolId, teacher_id: null, teacher_name: 'الإدارة',
      date: isoDay(), created_at: new Date().toISOString(), ...patch };
    DB.homeworks.unshift(h); sendHomeworkNotif(h); Store.save();
    Toast('أُرسل الواجب وأُشعر الطلبة ✓', 'ok'); App.render();
  } }));
  $$('[data-edit-hw]').forEach(b => b.onclick = () => {
    const h = DB.homeworks.find(x => x.id === b.dataset.editHw); if (!h) return;
    homeworkEditor({ teacher: null, editing: h, onSave: patch => {
      Object.assign(h, patch); sendHomeworkNotif(h, false); Store.save();
      Toast('تم تعديل الواجب ✓', 'ok'); App.render();
    } });
  });
  $$('[data-thread]').forEach(b => b.onclick = () => App.go('thread', { id: b.dataset.thread }));
}

function openStudentGrades(student) {
  const period = App.params.period || 'm1';
  Sheet.open({
    title: student.name,
    sub: `${PERIOD_LABEL(period)} — ${Q.label.grade(student.grade_id)} / شعبة ${Q.label.section(student.section_id)}`,
    body: DB.subjects.map((s, i) => `<div class="field" style="display:flex;align-items:center;gap:10px;margin-bottom:9px">
        <label style="flex:1;margin:0;font-size:13px;color:var(--label)">${esc(s.name)}</label>
        <input class="input" data-gsub="${s.id}" inputmode="numeric" dir="ltr" style="width:88px;padding:10px;text-align:center"
          value="${Q.monthGrade(student.id, s.id, period) ?? ''}" placeholder="—">
      </div>`).join(''),
    actions: `<button class="btn" id="saveGrades">${ic('check')} حفظ الدرجات</button>`,
    onMount(ov, close) {
      $('#saveGrades', ov).onclick = () => {
        let saved = 0;
        $$('[data-gsub]', ov).forEach(inp => {
          const raw = inp.value.trim(); if (raw === '') return;
          const v = +raw; if (!(v >= 0 && v <= 100)) return;
          let row = DB.monthlyGrades.find(g => g.student_id === student.id && g.subject_id === inp.dataset.gsub && g.period === period);
          if (row) row.value = v; else DB.monthlyGrades.push({ student_id: student.id, subject_id: inp.dataset.gsub, period, value: v, max: 100 });
          saved++;
        });
        if (saved) Q.push('student', 'grade', 'درجة جديدة', `${PERIOD_LABEL(period)} — تم تسجيل ${saved} درجة جديدة.`);
        Store.save(); close(); Toast('حُفظت الدرجات ✓', 'ok'); App.render();
      };
    }
  });
}

    accRow(s, `${Q.label.grade(s.grade_id)} · شعبة ${Q.label.section(s.section_id)}`)).join('');
  if (kind === 'teacher') rows = DB.teachers.filter(t => t.school_id === App.schoolId).map(t =>
    accRow(t, `${Q.subject(t.subject_id)?.name} · ${(t.section_ids || []).map(id => 'شعبة ' + Q.label.section(id)).join(' ')}`)).join('');
  if (kind === 'guardian') rows = Q.guardians().map(g =>
    accRow(g, `${(g.student_ids || []).length} أبناء · ${g.relation || ''}`)).join('');

function accRow(x, meta) {
  return `<div class="row">
    <div class="rt"><b>${esc(x.name)}</b><span>${esc(meta)}</span>
      <span style="font-family:ui-monospace;letter-spacing:.5px;color:var(--blue);font-weight:800">${esc(x.code)}</span></div>
    <button class="icon-btn plain" style="width:32px;height:32px" data-edit-acc="${x.id}">${ic('edit')}</button>
    <button class="icon-btn plain" style="width:32px;height:32px;color:var(--red)" data-del-acc="${x.id}">${ic('trash')}</button>
  </div>`;
}

function allCodes(exceptId) {
  const out = [];
  DB.students.forEach(s => s.id !== exceptId && out.push(s.code));
  DB.teachers.forEach(t => t.id !== exceptId && out.push(t.code));
  Q.guardians().forEach(g => g.id !== exceptId && out.push(g.code));
  DB.drivers.forEach(d => d.id !== exceptId && out.push(d.code));
  return out.map(c => String(c).toUpperCase());
}

function accountEditor(kind, id) {
  const isNew = !id;
  const rec = isNew ? {} : (kind === 'student' ? Q.student(id) : kind === 'teacher' ? Q.teacher(id)
    : kind === 'guardian' ? Q.guardians().find(g => g.id === id) : Q.driver(id));
  const T = { student: 'طالب', teacher: 'مدرس', guardian: 'ولي أمر', driver: 'حساب اشتراك' }[kind];
  let body = `<div class="field"><label>الاسم</label><input class="input" id="fName" value="${esc(rec.name || '')}"></div>
    <div class="field"><label>الكود (فريد)</label><input class="input" id="fCode" value="${esc(rec.code || '')}" dir="ltr"></div>
    <div class="field"><label>كلمة المرور</label><input class="input" id="fPw" value="${esc(rec.password || '1234')}" dir="ltr"></div>`;
  if (kind === 'student') {
    body += `<div class="field"><label>الصف</label><select class="input" id="fGrade">
        ${Q.gradesOf(App.schoolId).map(g => `<option value="${g.id}" ${rec.grade_id === g.id ? 'selected' : ''}>${esc(g.name)}</option>`).join('')}</select></div>
      <div class="field"><label>الشعبة</label><select class="input" id="fSec"></select></div>
      <div class="field"><label>هاتف ولي الأمر</label><input class="input" id="fPhone" inputmode="numeric" dir="ltr" value="${esc(rec.guardian_phone || '')}"></div>`;
  }
  if (kind === 'teacher') {
    body += `<div class="field"><label>المادة</label><select class="input" id="fSubject">
        ${DB.subjects.map(s => `<option value="${s.id}" ${rec.subject_id === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></div>
      <div class="field"><label>الصف</label><select class="input" id="fGrade">
        ${Q.gradesOf(App.schoolId).map(g => `<option value="${g.id}" ${rec.grade_id === g.id ? 'selected' : ''}>${esc(g.name)}</option>`).join('')}</select></div>
      <div class="field"><label>الشعب</label><div class="pick" id="fSecs"></div></div>`;
  }
  if (kind === 'guardian') {
    body += `<div class="field"><label>صلة القرابة</label><input class="input" id="fRelation" value="${esc(rec.relation || 'الأب')}"></div>
      <div class="field"><label>الأبناء</label><div class="pick max" id="fKids">
        ${DB.students.filter(s => s.school_id === App.schoolId).map(s => `<div class="pick-row ${(rec.student_ids || []).includes(s.id) ? 'on' : ''}" data-kid="${s.id}">
          <div class="cb">${ic('check')}</div><div class="pt"><b>${esc(s.name)}</b><span>${esc(Q.label.grade(s.grade_id))}</span></div></div>`).join('')}
      </div></div>`;
  }
  if (kind === 'driver') {
    body += `<div class="field"><label>الهاتف</label><input class="input" id="fPhone" inputmode="numeric" dir="ltr" value="${esc(rec.phone || '')}"></div>
      <div class="field"><label>نوع السيارة</label><input class="input" id="fCar" value="${esc(rec.car_type || '')}"></div>
      <div class="field"><label>المقاعد</label><input class="input" id="fSeats" inputmode="numeric" dir="ltr" value="${esc(rec.seats || 12)}"></div>
      <div class="field"><label>المناطق (مفصولة بفاصلة)</label><textarea class="input" id="fAreas">${esc((rec.areas || []).join('، '))}</textarea></div>`;
  }
  const picked = { secs: new Set(rec.section_ids || []), kids: new Set(rec.student_ids || []) };

  Sheet.open({
    title: isNew ? `إضافة ${T}` : `تعديل ${T}`, sub: isNew ? 'الكود لا يتكرر' : '',
    body, actions: `<button class="btn" id="saveAcc">${ic('check')} حفظ</button>`,
    onMount(ov, close) {
      const gSel = $('#fGrade', ov);
      const secBox = $('#fSec', ov) || $('#fSecs', ov);
      const drawSecs = () => {
        const secs = Q.sectionsOf(gSel.value);
        if (secBox.tagName === 'SELECT') {
          secBox.innerHTML = secs.map(s => `<option value="${s.id}" ${rec.section_id === s.id ? 'selected' : ''}>شعبة ${esc(s.name)}</option>`).join('');
        } else {
          secBox.innerHTML = secs.map(s => `<div class="pick-row ${picked.secs.has(s.id) ? 'on' : ''}" data-sec="${s.id}">
            <div class="cb">${ic('check')}</div><div class="pt"><b>شعبة ${esc(s.name)}</b><span>${Q.studentsOf(s.id).length} طالب</span></div></div>`).join('');
          $$('[data-sec]', secBox).forEach(r => r.onclick = () => {
            const id2 = r.dataset.sec;
            if (picked.secs.has(id2)) picked.secs.delete(id2); else picked.secs.add(id2);
            r.classList.toggle('on');
          });
        }
      };
      if (gSel) { gSel.onchange = drawSecs; drawSecs(); }
      $$('[data-kid]', ov).forEach(r => r.onclick = () => {
        const id2 = r.dataset.kid;
        if (picked.kids.has(id2)) picked.kids.delete(id2); else picked.kids.add(id2);
        r.classList.toggle('on');
      });
      $('#saveAcc', ov).onclick = () => {
        const name = $('#fName', ov).value.trim(), code = $('#fCode', ov).value.trim().toUpperCase(), pw = $('#fPw', ov).value.trim();
        if (name.length < 3) return Toast('اكتب الاسم', 'err');
        if (code.length < 3) return Toast('الكود قصير', 'err');
        if (allCodes(rec.id).includes(code)) return Toast('هذا الكود مستخدم لحساب آخر', 'err');
        if (pw.length < 4) return Toast('كلمة المرور ٤ أحرف على الأقل', 'err');
        let t = rec;
        if (isNew) {
          t = { id: uid(kind === 'student' ? 'st' : kind === 'teacher' ? 't' : kind === 'guardian' ? 'gu' : 'dr'), order: 999 };
          if (kind === 'student') DB.students.push(t);
          if (kind === 'teacher') DB.teachers.push(t);
          if (kind === 'guardian') { DB.guardians = Q.guardians(); DB.guardians.push(t); }
          if (kind === 'driver') { t.students = []; DB.drivers.push(t); }
        }
        t.name = name; t.code = code; t.password = pw;
        if (kind === 'student') {
          t.school_id = App.schoolId; t.grade_id = gSel.value; t.section_id = ($('#fSec', ov) || {}).value;
          t.guardian_phone = $('#fPhone', ov).value.replace(/\D/g, '');
        }
        if (kind === 'teacher') {
          t.school_id = App.schoolId; t.grade_id = gSel.value; t.subject_id = $('#fSubject', ov).value;
          t.section_ids = [...picked.secs];
        }
        if (kind === 'guardian') { t.relation = $('#fRelation', ov).value.trim(); t.student_ids = [...picked.kids]; }
        if (kind === 'driver') {
          t.phone = $('#fPhone', ov).value.trim(); t.car_type = $('#fCar', ov).value.trim();
          t.seats = +$('#fSeats', ov).value || 12;
          t.areas = $('#fAreas', ov).value.split(/[،,]/).map(x => x.trim()).filter(Boolean);
        }
        Store.save(); close(); Toast('تم الحفظ ✓', 'ok'); App.render();
      };
    }
  });
}

function deleteAccount(kind, id) {
  const rec = kind === 'student' ? Q.student(id) : kind === 'teacher' ? Q.teacher(id)
    : kind === 'guardian' ? Q.guardians().find(g => g.id === id) : Q.driver(id);
  if (!rec) return;
  Confirm({ title: 'حذف الحساب', message: `سيُحذف «${esc(rec.name)}» حذفاً نهائياً من كل مكان.`, confirmText: 'حذف نهائي', danger: true, onYes: () => {
    if (kind === 'student') {
      DB.students = DB.students.filter(s => s.id !== id);
      DB.dailyGrades = DB.dailyGrades.filter(g => g.student_id !== id);
      DB.monthlyGrades = DB.monthlyGrades.filter(g => g.student_id !== id);
      DB.requests = DB.requests.filter(r => r.student_id !== id);
      DB.drivers.forEach(d => d.students = (d.students || []).filter(x => x !== id));
      DB.guardians.forEach(g => g.student_ids = (g.student_ids || []).filter(x => x !== id));
    }
    if (kind === 'teacher') { DB.teachers = DB.teachers.filter(t => t.id !== id); DB.homeworks.forEach(h => { if (h.teacher_id === id) h.teacher_id = null; }); }
    if (kind === 'guardian') { DB.guardians = Q.guardians().filter(g => g.id !== id); DB.guardian = DB.guardians[0] || null; }
    if (kind === 'driver') { DB.drivers = DB.drivers.filter(d => d.id !== id); DB.requests = DB.requests.filter(r => r.driver_id !== id); }
    Store.save(); Toast('تم الحذف نهائياً', 'ok'); App.render();
  } });
}

function bindAnnounce() {
  const scope = $('#anScope'); if (!scope) return;
  const pickedGrades = new Set(), pickedSecs = new Set();
  let images = 0, pdf = '';
  const drawSecs = () => {
    const wrap = $('#anSecs');
    const grades = [...pickedGrades];
    const secs = grades.flatMap(g => Q.sectionsOf(g));
    wrap.innerHTML = secs.map(s => `<div class="pick-row ${pickedSecs.has(s.id) ? 'on' : ''}" data-ansec="${s.id}">
      <div class="cb">${ic('check')}</div><div class="pt"><b>${esc(Q.label.grade(s.grade_id))} — شعبة ${esc(s.name)}</b></div></div>`).join('')
      || `<div style="padding:12px" class="small muted bold">اختر صفاً أولاً</div>`;
    $$('[data-ansec]', wrap).forEach(r => r.onclick = () => {
      const id = r.dataset.ansec;
      if (pickedSecs.has(id)) pickedSecs.delete(id); else pickedSecs.add(id);
      r.classList.toggle('on');
      $('#anSCount').textContent = `(${pickedSecs.size} مختارة)`;
    });
    $('#anSCount').textContent = `(${pickedSecs.size} مختارة)`;
  };
  scope.onchange = () => {
    const wrap = $('#anGradesWrap');
    wrap.style.display = scope.value === 'pick' ? 'block' : 'none';
    if (scope.value === 'pick' && !pickedGrades.size) {
      Q.gradesOf(App.schoolId).forEach(g => pickedGrades.add(g.id));
      Q.sectionsOf([...pickedGrades][0]).forEach(s => pickedSecs.add(s.id));
      $$('[data-ange]').forEach(r => r.classList.add('on'));
      drawSecs();
    }
  };
  $$('[data-ange]').forEach(r => r.onclick = () => {
    const id = r.dataset.ange;
    if (pickedGrades.has(id)) pickedGrades.delete(id); else pickedGrades.add(id);
    r.classList.toggle('on');
    $('#anGCount').textContent = `(${pickedGrades.size} مختارة)`;
    drawSecs();
  });
  $('#anImg').onclick = () => { images = images ? 0 : 1; $('#anImgT').textContent = images ? 'صورة مرفقة ✓' : 'صورة'; };
  $('#anPdf').onclick = () => { pdf = pdf ? '' : 'تعميم.pdf'; $('#anPdfT').textContent = pdf || 'PDF'; };
  $('#anSend').onclick = () => {
    const text = $('#anText').value.trim();
    if (text.length < 3) return Toast('اكتب نص التبليغ', 'err');
    const scopeVal = scope.value;
    if (scopeVal === 'pick' && !pickedSecs.size) return Toast('اختر شعبة واحدة على الأقل', 'err');
    const link = $('#anLink').value.trim();
    const extra = [images ? 'صورة مرفقة' : '', pdf ? 'مرفق PDF' : '', link ? 'رابط مرفق' : ''].filter(Boolean).join(' · ');
    Q.push('student', 'admin', 'تبليغ من الإدارة', text + (extra ? ` — ${extra}` : ''));
    Store.save(); Toast('أُرسل التبليغ ✓', 'ok'); App.render();
  };
}

/* ==========================================================================
   17) إضافة واجب سريعة (مدرس أو إدارة)
   ========================================================================== */
function openNewHomework() {
  if (App.role === 'teacher') {
    const t = teacherOf();
    homeworkEditor({ teacher: t, onSave: patch => {
      const h = { id: uid('hw'), school_id: t.school_id, teacher_id: t.id, teacher_name: t.name,
        date: isoDay(), created_at: new Date().toISOString(), ...patch };
      DB.homeworks.unshift(h); sendHomeworkNotif(h); Store.save();
      Toast('أُرسل الواجب وأُشعر الطلبة ✓', 'ok');
      App.route = 'hw'; App.params = {}; App.render();
    } });
  } else {
    homeworkEditor({ teacher: null, onSave: patch => {
      const h = { id: uid('hw'), school_id: App.schoolId, teacher_id: null, teacher_name: 'الإدارة',
        date: isoDay(), created_at: new Date().toISOString(), ...patch };
      DB.homeworks.unshift(h); sendHomeworkNotif(h); Store.save();
      Toast('أُرسل الواجب وأُشعر الطلبة ✓', 'ok');
      App.route = 'homework'; App.params = {}; App.render();
    } });
  }
}

/* ==========================================================================
   17ب) تنبيه تثبيت التطبيق على آيفون (يظهر مرة واحدة فقط)
   ========================================================================== */
function iosInstallHint() {
  try {
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const isSafari = /Safari/.test(navigator.userAgent) && !/CriOS|FxiOS|EdgiOS|OPiOS/.test(navigator.userAgent);
    const standalone = window.navigator.standalone === true ||
                       (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    if (!isIOS || standalone) return;
    if (localStorage.getItem('alawael.iosHint') === 'off') return;
    if (document.getElementById('iosHint')) return;
    const el = document.createElement('div');
    el.id = 'iosHint';
    el.dir = 'rtl';
    el.style.cssText = 'position:fixed;inset-inline:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:9999;' +
      'background:#0B1226;color:#fff;border-radius:20px;padding:14px 16px;box-shadow:0 18px 40px rgba(8,20,50,.35);' +
      'font-family:inherit;font-size:13px;font-weight:700;line-height:1.9;display:flex;gap:12px;align-items:flex-start';
    el.innerHTML = '<div style="flex:1">' +
      '<b style="display:block;font-size:13.5px;margin-bottom:4px">ثبّت التطبيق على جوالك</b>' +
      (isSafari
        ? 'اضغط زر المشاركة <span style="font-size:16px">⬆️</span> أسفل الشاشة ← مرّر ← <b>إضافة إلى الشاشة الرئيسية</b>.'
        : 'افتح هذا الرابط من <b>Safari</b> (لا من متصفح آخر) ثم: مشاركة ⬆️ ← <b>إضافة إلى الشاشة الرئيسية</b>.') +
      '</div><button id="iosHintX" style="background:rgba(255,255,255,.14);border:0;color:#fff;width:28px;height:28px;' +
      'border-radius:10px;font-size:15px;font-weight:800;line-height:1;cursor:pointer;flex:none">×</button>';
    document.body.appendChild(el);
    el.querySelector('#iosHintX').onclick = () => {
      localStorage.setItem('alawael.iosHint', 'off');
      el.remove();
    };
  } catch (e) {}
}

/* ==========================================================================
   19) الإشعارات الفورية (Web Push) — تصل حتى لو كان التطبيق مغلقاً
   ========================================================================== */
const PushSetup = (() => {
  const PUBLIC_KEY = 'BLwHuskjhG82l_K_GXIcQS05t-sCbF42lrS_Am7juhrEIcvzIVvFPyd0r0KlDgMaq1g1JeOXriwxvg1Tg7CkvwI';
  const KEY = 'alawael.push';
  const urlB64ToUint8Array = (b64) => {
    const pad = '='.repeat((4 - (b64.length % 4)) % 4);
    const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
    return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
  };
  const supported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  const state = () => {
    try { return localStorage.getItem(KEY) || 'off'; } catch (e) { return 'off'; }
  };
  const setState = (v) => { try { localStorage.setItem(KEY, v); } catch (e) {} };

  /* ربط الاشتراك بصاحب الحساب ليصل كل إشعار لصاحبه فقط */
  function ownerInfo() {
    if (!App.role) return null;
    const map = { student: 'student', guardian: 'student', teacher: 'teacher', driver: 'driver', admin: 'admin' };
    const owner = App.role === 'student' ? App.user?.studentId
      : App.role === 'teacher' ? App.user?.teacherId
      : App.role === 'driver' ? App.user?.driverId
      : App.role === 'guardian' ? (App.asStudent || (Q.guardians().find(g => g.id === App.user?.guardianId)?.student_ids || [])[0])
      : null;
    return { to: map[App.role] || 'student', owner: owner || null, role: App.role };
  }

  async function saveSub(sub) {
    if (typeof CloudApp === 'undefined' || !CloudApp.enabled) return false;
    const info = ownerInfo();
    if (!info) return false;
    const cfg = CloudApp.cfg || {};
    const base = String(cfg.url || '').replace(/\/$/, '');
    const headers = { apikey: cfg.key, Authorization: 'Bearer ' + cfg.key, 'Content-Type': 'application/json' };
    const rec = {
      id: 'ps_' + (info.owner || 'x') + '_' + Math.random().toString(36).slice(2, 8),
      owner: info.owner, to: info.to, role: info.role,
      endpoint: sub.endpoint, keys: sub.toJSON ? sub.toJSON().keys : sub.keys,
      created_at: new Date().toISOString()
    };
    /* لا نمسح اشتراكات الأجهزة الأخرى: نقرأ القائمة ثم نضيف/نحدّث اشتراك هذا الجهاز فقط */
    let list = [];
    try {
      const r = await fetch(base + '/rest/v1/kv?select=value&key=eq.pushSubs', { headers });
      const rows = await r.json();
      if (rows && rows[0] && Array.isArray(rows[0].value)) list = rows[0].value;
    } catch (e) {}
    list = list.filter(x => x && x.endpoint !== rec.endpoint);
    rec.owner = info.owner;
    list.push(rec);
    if (list.length > 500) list = list.slice(-500);
    await fetch(base + '/rest/v1/kv?on_conflict=key', {
      method: 'POST', headers: { ...headers, Prefer: 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify([{ key: 'pushSubs', value: list, rev: Date.now() }])
    });
    return true;
  }

  async function enable() {
    if (!supported()) {
      Toast('جهازك لا يدعم الإشعارات — على الآيفون: أضف التطبيق إلى الشاشة الرئيسية أولاً', 'err', 5000);
      return false;
    }
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { Toast('لم تُمنح صلاحية الإشعارات', 'err'); return false; }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlB64ToUint8Array(PUBLIC_KEY)
      });
    }
    const ok = await saveSub(sub);
    setState('on');
    Toast(ok ? 'تم تشغيل الإشعارات ✓' : 'تم التشغيل محلياً — ستُزامن عند الاتصال', 'ok');
    return true;
  }

  function init() {
    if (!supported()) return;
    /* إن كان الاشتراك قائماً من قبل: أعِد ربطه بالحساب الحالي (لمنع وصول إشعارات حساب لآخر) */
    if (state() === 'on' && Notification.permission === 'granted' && App.role) {
      navigator.serviceWorker.ready
        .then(r => r.pushManager.getSubscription())
        .then(sub => { if (sub) return saveSub(sub); })
        .catch(() => {});
    }
  }

  return { init, enable, state, supported, PUBLIC_KEY };
})();

/* ==========================================================================
   18) التهيئة
   ========================================================================== */
(async function boot() {
  Store.load();
  /* إن كانت المزامنة السحابية مفعّلة: اسحب بيانات اللوحة قبل أول رسم */
  try { if (typeof CloudApp !== 'undefined' && CloudApp.enabled) await CloudApp.boot(); } catch (e) { console.warn('[cloud]', e); }
  if (!DB.guardians) DB.guardians = DB.guardian ? [DB.guardian] : [];
  /* استعادة الجلسة: لا نطلب الدخول من جديد بعد إغلاق التطبيق */
  try { if (App.restoreSession) App.restoreSession(); } catch (e) {}
  App.render();


  setTimeout(iosInstallHint, 1600);
  /* كشف التشغيل كتطبيق مثبّت (احتياطي للمتصفحات القديمة) */
  try {
    const stand = window.navigator.standalone === true ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    if (stand) document.documentElement.classList.add('ios-standalone');
  } catch (e) {}
  /* عند توفر نسخة جديدة من عامل الخدمة: حدّث تلقائياً */
  try {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (sessionStorage.getItem('alawael.reloaded')) return;
        sessionStorage.setItem('alawael.reloaded', '1');
        location.reload();
      });
    }
  } catch (e) {}
  /* إشعارات تصل حتى لو كان التطبيق مغلقاً (Web Push) */
  try { if (typeof PushSetup !== 'undefined') setTimeout(() => PushSetup.init(), 2500); } catch (e) {}
  /* تسجيل عامل الخدمة: يجعل التطبيق يعمل بلا إنترنت */
  try {
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  } catch (e) {}
  const tick = () => {
    const d = new Date();
    const c = $('#clock'); if (c) c.textContent = `${d.getHours()}:${pad(d.getMinutes())}`;
  };
  tick(); setInterval(tick, 10000);
  /* فحص فوري كل 10 ثوانٍ: الإشعارات والرسائل والواجبات تصل بحد أقصى 10 ثوانٍ */
  setInterval(() => { if (App.role) App.checkNotifs(); }, 10000);
  /* عند العودة إلى التطبيق: سحب فوري ثم تحديث الشاشة */
  const pullNow = () => {
    if (typeof CloudApp !== 'undefined' && CloudApp.enabled) {
      CloudApp.tick().then(() => { try { App.render(); } catch (e) {} }).catch(() => {});
    } else if (App.role) { try { App.render(); } catch (e) {} }
  };
  try {
    document.addEventListener('visibilitychange', () => { if (!document.hidden) pullNow(); });
    window.addEventListener('focus', pullNow);
  } catch (e) {}
})();

</script>
