# ملف واحد فقط: انسخه إلى مستودعك في المسار .github/workflows/push.yml
# يعمل كل 5 دقائق مجاناً ويُرسل إشعارات الجوال حتى لو كان التطبيق مغلقاً.
name: send-push

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install
        run: npm i web-push@3.6.7 --no-save
      - name: send
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: node tools/push-send.mjs
